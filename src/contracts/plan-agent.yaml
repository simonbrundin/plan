# Kontraktet mellan Plan och agenten.
#
# Plan äger agentkörningarna - agenten läser och skriver dem via Plan API:t.
# Den här filen beskriver de delar av kontraktet agenten använder: faser,
# tillstånd, triggrar, profiler och de API-anrop agenten gör.
#
# Filen är versionsstyrd. Båda sidor testar mot den:
#
#   src/api/internal/contracts     - Plan API:t (faser, tillstånd, Swagger)
#   src/agent/internal/planclient - agentens klient (konstanter, sökvägar)
#
# Om en sida ändras utan den andra faller testerna. Ändras kontraktet på ett
# sätt som kräver samtidig ändring på båda sidor, bumpas versionen.
#
# versionshistorik:
#   1 - 2026-11-25 - första versionen. Bytte samtidigt "blocked" till
#       "waiting_approval" och "done" till "succeeded" i API, agent,
#       gränssnitt och databas.
#   2 - 2026-11-25 - markerade vilka anrop agenten faktiskt gör (agent: true).
#       Plan måste tillåta dem för agent-scope, annars får agenten 403 i prod
#       där nyckeln har scope 'agent' (i dev har den scope 'full', så felet
#       syns inte där).
#   3 - 2026-11-26 - lade till godkännandetyperna (goal_definition och
#       code_change) så att en människa och agenten kan skilja på vad som
#       föreslogs. Lade också till de anrop agenten behöver för en rik
#       måldefinition: platser, taggar och platser på ett mål.
#   4 - 2026-11-28 - fasmaskinen och den valfria verifieringen. Lade till
#       fasövergångarna med sina villkor, åtgärdsprofilerna och anropen för
#       fasbyten, verifieringsplan, bevis och verifieringsomdömen. Agenten
#       får inte avsluta ett mål eller godkänna ett omdöme - de anropen
#       står i kontraktet utan agent: true.

version: 4

# Agentkörningens faser, i den ordning de sker.
phases:
  - define
  - plan
  - execute
  - verify
  - completed

# Agentkörningens tillstånd.
statuses:
  - queued
  - running
  - waiting_approval
  - succeeded
  - failed
  - cancelled

# Tillstånd som en körning inte kan lämna.
terminal_statuses:
  - succeeded
  - failed
  - cancelled

# Tillstånd där en människa måste agera innan agenten fortsätter.
status_needing_human:
  - waiting_approval

# Vad som startade en körning.
triggers:
  - user
  - schedule
  - webhook
  - agent

# Vilken sorts agent som utför körningen.
#
# De här profilerna är tekniska gränser i agentens kod. Det är
# åtgärdsprofilerna nedan som styr vad agenten får göra i en viss
# körning - de följer uppgiften, inte målets ämne.
profiles:
  - coding
  - life

# Åtgärdsprofilerna - vad agenten får göra i en körning.
#
# Profilen föreslås av agenten i definitionen och godkänns av användaren.
# Standardprofilen är den strängaste.
#
#   planering - prata, bryta ned, föreslå, fråga. Skriver ingenting.
#   research  - läsa och samla underlag. Skriver ingenting.
#   arbete    - arbeta i en isolerad kopia, skriva kod, föreslå ändringar.
action_profiles:
  - planering
  - research
  - arbete

# Villkor för att en målfas får bytas.
#
# Plan API:t kollar villkoren - en agent får gå en fas framåt i taget och
# måste ha det som står i requires. En människa får hoppa över faser, men
# hoppet loggas som en avvikelse.
#
# reason är skälkoden API:t svarar med om villkoret inte är uppfyllt.
phase_transitions:
  - from: define
    to: plan
    requires: approved_definition
    reason: definition_not_approved
  - from: plan
    to: execute
    requires: planned_children
    reason: missing_planned_children
  - from: execute
    to: verify
    requires: resolved_children
    reason: unresolved_children
  - from: verify
    to: completed
    requires: human_decision
    reason: approval_required

# Typer av godkännanden. Typen ligger i godkännandets payload ("kind") så
# att en människa ser vad som föreslogs och att agenten inte blandar ihop
# ett definitionsförslag med ett kodförslag i samma körning.
#
# Plan avvisar ett godkännande med en okänd typ. Ett godkännande utan typ
# behandlas som code_change - så att förslag som skapats tidigare
# fortfarande fungerar.
approval_kinds:
  - goal_definition
  - code_change

# De API-anrop agenten gör mot Plan. Sökvägarna skrivs med {id} för
# parametrar - i koden motsvaras de av format-strängar med %d.
#
# agent: true betyder att agenten själv gör anropet. Plan måste då tillåta
# det för agent-scope - det är agentens egen nyckel som används, och den
# har scope 'agent' i prod.
endpoints:
  - method: GET
    path: /api/v1/goals
    agent: true
  - method: POST
    path: /api/v1/goals
    agent: true
  - method: GET
    path: /api/v1/goals/{id}
    agent: true
  - method: PATCH
    path: /api/v1/goals/{id}
    agent: true
  - method: GET
    path: /api/v1/goals/{id}/status
  - method: PATCH
    path: /api/v1/goals/{id}/status
    agent: true
  # Fasmaskinen. Agenten får begära en övergång - villkoren kontrolleras
  # i API:t, precis som för en människa. Ett stoppat byte svarar med 409
  # och en skälkod.
  - method: POST
    path: /api/v1/goals/{id}/phase
    agent: true
  # Verifieringsplanen, bevisen och omdömet. Planen är valfri - ett mål
  # utan plan fungerar precis som ett mål med plan.
  - method: GET
    path: /api/v1/goals/{id}/verification
    agent: true
  - method: PUT
    path: /api/v1/goals/{id}/verification
    agent: true
  - method: POST
    path: /api/v1/goals/{id}/evidence
    agent: true
  - method: POST
    path: /api/v1/goals/{id}/verification/run
    agent: true
  # Målsidan: att avsluta ett mål och att godkänna ett omdöme är
  # människans beslut. Agenten får inte göra det - därför står de här
  # utan agent: true.
  - method: POST
    path: /api/v1/goals/{id}/complete
  - method: POST
    path: /api/v1/verification-results/{id}/approve
  - method: GET
    path: /api/v1/statuses
    agent: true
  - method: GET
    path: /api/v1/places
    agent: true
  - method: PUT
    path: /api/v1/goals/{id}/tags
    agent: true
  - method: PUT
    path: /api/v1/goals/{id}/places
    agent: true
  - method: POST
    path: /api/v1/goals/relations
    agent: true
  - method: GET
    path: /api/v1/agent-runs
    agent: true
  - method: POST
    path: /api/v1/agent-runs
    agent: true
  - method: PATCH
    path: /api/v1/agent-runs/{id}
    agent: true
  - method: POST
    path: /api/v1/agent-runs/{id}/cancel
  - method: GET
    path: /api/v1/agent-run-lifecycle
  - method: GET
    path: /api/v1/agent-runs/{id}/usage
  - method: POST
    path: /api/v1/agent-runs/{id}/usage
    agent: true
  - method: GET
    path: /api/v1/agent-runs/{id}/events
  - method: POST
    path: /api/v1/agent-runs/{id}/events
    agent: true
  - method: GET
    path: /api/v1/agent-runs/{id}/approvals
    agent: true
  - method: POST
    path: /api/v1/agent-runs/{id}/approvals
    agent: true
