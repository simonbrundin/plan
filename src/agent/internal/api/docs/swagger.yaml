basePath: /
definitions:
  handlers.ApprovePlanRequest:
    properties:
      approvedBy:
        type: string
    type: object
  handlers.CreateConversationRequest:
    properties:
      model:
        type: string
      provider:
        type: string
      title:
        type: string
    type: object
  handlers.CreateMessageRequest:
    properties:
      content:
        type: string
    type: object
  handlers.Goal:
    properties:
      completed_at:
        type: string
      created:
        type: string
      description:
        type: string
      icon:
        type: string
      id:
        type: string
      parent_id:
        type: string
      priority:
        type: integer
      status:
        type: string
      title:
        type: string
    type: object
  handlers.GoalStatus:
    properties:
      label:
        type: string
      name:
        type: string
    type: object
  handlers.GoalsResponse:
    properties:
      goals:
        items:
          $ref: '#/definitions/handlers.Goal'
        type: array
      statuses:
        items:
          $ref: '#/definitions/handlers.GoalStatus'
        type: array
    type: object
  handlers.SetAPIKeyRequest:
    properties:
      api_key:
        type: string
      model:
        type: string
      provider:
        type: string
    required:
    - api_key
    - provider
    type: object
  handlers.StartAgentRequest:
    properties:
      goal_id:
        type: string
      instructions:
        type: string
    type: object
  handlers.StartWorkflowRequest:
    properties:
      description:
        type: string
      feature:
        type: string
    required:
    - feature
    type: object
  handlers.SubmitDecisionRequest:
    properties:
      approved:
        type: boolean
      checkpointId:
        type: string
      feedback:
        type: string
    required:
    - checkpointId
    type: object
  handlers.UpdateConversationRequest:
    properties:
      title:
        type: string
    type: object
  handlers.UpdateGoalRequest:
    properties:
      description:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for the Software Agent system
  title: Agent API
  version: "1.0"
paths:
  /api/v1/api-keys:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List API keys
      tags:
      - api-keys
    post:
      consumes:
      - application/json
      parameters:
      - description: API key request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.SetAPIKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set an API key
      tags:
      - api-keys
  /api/v1/api-keys/{provider}:
    delete:
      parameters:
      - description: Provider name
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete an API key
      tags:
      - api-keys
  /api/v1/conversations:
    get:
      parameters:
      - default: 50
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all conversations
      tags:
      - conversations
    post:
      consumes:
      - application/json
      parameters:
      - description: Conversation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateConversationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new conversation
      tags:
      - conversations
  /api/v1/conversations/{id}:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a conversation by ID
      tags:
      - conversations
    patch:
      consumes:
      - application/json
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - description: Update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateConversationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a conversation
      tags:
      - conversations
  /api/v1/conversations/{id}/messages:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get messages for a conversation
      tags:
      - messages
    post:
      consumes:
      - application/json
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - description: Message request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateMessageRequest'
      produces:
      - application/x-ndjson
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Send a message to the agent
      tags:
      - messages
  /api/v1/conversations/{id}/stream:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Stream messages via SSE
      tags:
      - messages
  /api/v1/goals:
    get:
      description: Returns all goals with their statuses from the goals.json file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.GoalsResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all goals
      tags:
      - goals
  /api/v1/goals/{id}:
    get:
      description: Returns a specific goal with all its children
      parameters:
      - description: Goal ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Goal'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a goal by ID
      tags:
      - goals
    patch:
      consumes:
      - application/json
      description: Updates a goal's status, title, or description
      parameters:
      - description: Goal ID
        in: path
        name: id
        required: true
        type: string
      - description: Goal update
        in: body
        name: goal
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateGoalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Goal'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a goal
      tags:
      - goals
  /api/v1/goals/start-agent:
    post:
      consumes:
      - application/json
      description: Starts an agent to work on a specific goal with optional instructions
      parameters:
      - description: Start agent request
        in: body
        name: goal
        required: true
        schema:
          $ref: '#/definitions/handlers.StartAgentRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start agent for a goal
      tags:
      - goals
  /api/v1/goals/stats:
    get:
      description: Returns statistics about all goals
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get goal statistics
      tags:
      - goals
  /api/v1/health:
    get:
      description: Returns OK if the service is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /api/v1/readme:
    get:
      description: Returns the README.md content from the project root
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Get README
      tags:
      - docs
  /api/v1/roadmap:
    get:
      description: Returns the ROADMAP.md content from the project root
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Get Roadmap
      tags:
      - docs
  /api/v1/status:
    get:
      description: Returns detailed service status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Service status
      tags:
      - health
  /api/v1/workflow:
    post:
      consumes:
      - application/json
      description: Creates a checkpoint plan for a feature
      parameters:
      - description: Workflow request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.StartWorkflowRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Start a new workflow
      tags:
      - workflow
  /api/v1/workflow/{id}:
    get:
      description: Returns details of a specific plan
      parameters:
      - description: Plan ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get plan details
      tags:
      - workflow
  /api/v1/workflow/{id}/approve:
    post:
      description: Marks a plan as approved
      parameters:
      - description: Plan ID
        in: path
        name: id
        required: true
        type: string
      - description: Approval request
        in: body
        name: request
        schema:
          $ref: '#/definitions/handlers.ApprovePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Approve a plan
      tags:
      - workflow
  /api/v1/workflow/{id}/reject:
    post:
      description: Marks a plan as rejected
      parameters:
      - description: Plan ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Reject a plan
      tags:
      - workflow
  /api/v1/workflow/current/checkpoint:
    get:
      description: Returns the currently executing checkpoint
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get current checkpoint
      tags:
      - workflow
  /api/v1/workflow/current/progress:
    get:
      description: Returns gate progress for the current checkpoint
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get checkpoint progress
      tags:
      - workflow
  /api/v1/workflow/decision:
    post:
      consumes:
      - application/json
      description: Submit approval or rejection for a checkpoint
      parameters:
      - description: Decision request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.SubmitDecisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Submit human decision
      tags:
      - workflow
  /api/v1/workflow/plans:
    get:
      description: Returns all checkpoint plans
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List all plans
      tags:
      - workflow
schemes:
- http
swagger: "2.0"
