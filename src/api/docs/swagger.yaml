      parameters:
      - description: Agent run ID
        in: path
        name: id
        required: true
        type: integer
      - description: Usage to record
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateAgentRunUsageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AgentRunUsage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Record usage for an agent run
      tags:
      - agent-usage
  /api/v1/agent-usage:
