          vilka taggar som faktiskt används.
        example: 3
        type: integer
      name:
        example: ute
        type: string
    type: object
  models.UpdateAgentBudgetRequest:
    properties:
      active:
        type: boolean
      hard_limit_usd:
        type: number
      name:
        type: string
      period:
        type: string
      reservation_per_run_usd:
        type: number
      warning_limit_usd:
        type: number
    type: object
  models.UpdateAgentRunRequest:
    properties:
      agent_id:
        type: string
      agent_profile:
        type: string
      artifact_url:
        type: string
      conversation_id:
        type: string
      cost_usd:
        type: number
      finished_at:
        type: string
      initiator:
        type: string
      model:
        type: string
      model_version:
        type: string
      phase:
        type: string
      provider:
        type: string
      result:
        type: string
      started_at:
        type: string
      status:
        type: string
      summary:
        type: string
      trigger:
        type: string
    type: object
  models.UpdateCalendarEventRequest:
    properties:
      all_day:
        type: boolean
      calendar_id:
        description: |-
          CalendarID anger vilken kalender händelsen ska ligga i. Nil behåller
          händelsens nuvarande kalender, 0 tar bort den.
        type: integer
      description:
        type: string
      end_at:
        type: string
      goal_id:
        type: integer
      icon:
        type: string
      recurrence_rule:
        type: string
      start_at:
        type: string
      status:
        type: string
      time_zone:
        type: string
      title:
        type: string
    type: object
  models.UpdateGoalRequest:
    properties:
      agent:
        description: |-
          Agent sätter eller tar bort agent-flaggan på ett mål.
          nil = lämnas oförändrat, true = målet är för en agent, false = vanligt mål.
        type: boolean
      description:
        description: |-
          Description sätter eller rensar målets beskrivning.
          nil = lämnas oförändrat.
        type: string
      due:
        allOf:
        - $ref: '#/definitions/models.NullableDueDate'
        description: Due sätter eller rensar målets due-datum ("YYYY-MM-DD" eller
          null).
      estimated_minutes:
        allOf:
        - $ref: '#/definitions/models.NullableInt'
        description: |-
          EstimatedMinutes sätter eller rensar målets uppskattade tidsåtgång
          (antal minuter eller null).
      eternal:
        description: |-
          Eternal sätter eller tar bort evigt-flaggan på ett mål.
          nil = lämnas oförändrat, true = evigt mål, false = vanligt mål.
        type: boolean
      finished:
        $ref: '#/definitions/models.NullableTime'
      icon:
        type: string
      now:
        description: |-
          Now sätter eller tar bort nu-flaggan på ett mål.
          nil = lämnas oförändrat, true = målet ska göras nu, false = vanligt mål.
        type: boolean
      recurrence_mode:
        allOf:
        - $ref: '#/definitions/models.NullableString'
        description: RecurrenceMode sätter schemaläggningsstrategin ("schedule" eller
          "push").
      recurrence_rule:
        allOf:
        - $ref: '#/definitions/models.NullableString'
        description: |-
          RecurrenceRule sätter eller tar bort målets upprepningsregel.
          Utan fältet lämnas regeln oförändrad, null tar bort den.
      recurrence_start_date:
        description: RecurrenceStartDate är det datum serien startar på ("YYYY-MM-DD").
        type: string
      start_date:
        allOf:
        - $ref: '#/definitions/models.NullableDueDate'
        description: |-
          StartDate sätter eller rensar målets startdatum ("YYYY-MM-DD" eller
          null). Startdatumet avgör från vilket datum målet får dyka upp i
          prioriteringslistan.
      started:
        $ref: '#/definitions/models.NullableTime'
      status_id:
        type: integer
      title:
        type: string
    type: object
  models.UpdateGoalVerificationRequest:
    properties:
      criterion:
        example: 3 av 4 moment avbockade
        type: string
      strength:
        example: svag
        type: string
      type:
        example: checklista
        type: string
    required:
    - criterion
    - type
    type: object
  models.UpdatePlaceRequest:
    properties:
      icon:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      radius_meters:
        type: integer
    type: object
  models.UpdateRelationRequest:
    properties:
      childId:
