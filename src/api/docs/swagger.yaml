    type: object
  models.UpdateRelationWeightsRequest:
    properties:
      parentId:
        type: integer
      weights:
        items:
          $ref: '#/definitions/models.RelationWeight'
        minItems: 1
        type: array
    required:
    - parentId
    - weights
    type: object
  models.UpdateStatusRequest:
    properties:
      status_id:
        example: 2
        type: integer
    required:
    - status_id
    type: object
  usage.Stats:
    properties:
      averageLatencyMs:
        type: integer
      firstRequest:
        type: string
      lastRequest:
        type: string
      totalCost:
        type: number
      totalInputTokens:
        type: integer
      totalLatencyMs:
        type: integer
      totalOutputTokens:
        type: integer
      totalRequests:
        type: integer
    type: object
  usage.TokenUsage:
    properties:
      conversationId:
        type: string
      cost:
        description: Estimated cost in USD
        type: number
      id:
        type: string
      inputTokens:
        type: integer
      latencyMs:
        type: integer
      model:
        type: string
      outputTokens:
        type: integer
      provider:
        type: string
      timestamp:
        type: string
      totalTokens:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    name: Simon
    url: https://github.com/simonreming
  description: API for managing goals with parent-child relations and dependencies
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Goals Management API
  version: "1.0"
paths:
  /api/v1/agent-approvals:
    get:
      description: Get every proposal that waits for a human, optionally for one goal
      parameters:
      - description: Only approvals for this goal
        in: query
        name: goal_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AgentApproval'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List approvals waiting for a human decision
      tags:
      - agent-runs
  /api/v1/agent-approvals/{id}/decision:
    post:
      consumes:
      - application/json
      description: Approve or reject a proposal. Only a person can make this decision.
      parameters:
      - description: Approval ID
        in: path
        name: id
        required: true
        type: integer
      - description: Decision
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.DecideAgentApprovalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AgentApproval'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Decide an approval
      tags:
      - agent-runs
  /api/v1/agent-budgets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AgentBudget'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List agent budgets
      tags:
      - agent-budgets
    post:
      consumes:
      - application/json
      description: Create a cost limit for agent runs over a period. A hard limit
        blocks new runs, a warning limit only warns.
      parameters:
      - description: Budget to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateAgentBudgetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AgentBudget'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an agent budget
      tags:
      - agent-budgets
  /api/v1/agent-budgets/{id}:
    delete:
      parameters:
      - description: Budget ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an agent budget
      tags:
      - agent-budgets
    patch:
      consumes:
      - application/json
      description: Change the limits of an agent budget or pause it.
      parameters:
      - description: Budget ID
        in: path
        name: id
        required: true
        type: integer
      - description: Changes to apply
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateAgentBudgetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AgentBudget'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an agent budget
      tags:
      - agent-budgets
  /api/v1/agent-budgets/{id}/status:
    get:
      parameters:
      - description: Budget ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BudgetStatus'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Show the status of an agent budget
      tags:
      - agent-budgets
  /api/v1/agent-run-lifecycle:
    get:
      description: The canonical phases, statuses and allowed transitions for agent
        runs
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AgentRunLifecycle'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get agent run lifecycle
      tags:
      - agent-runs
  /api/v1/agent-runs:
    get:
      description: Get agent runs for the authenticated user, optionally filtered
