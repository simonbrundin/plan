      parameters:
      - description: Filter by goal ID
        in: query
        name: goal_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AgentRun'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List agent runs
      tags:
      - agent-runs
    post:
      consumes:
      - application/json
      description: Register that an agent started working on a goal
      parameters:
      - description: Agent run
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateAgentRunRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AgentRun'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Start an agent run
      tags:
      - agent-runs
  /api/v1/agent-runs/{id}:
    patch:
      consumes:
      - application/json
      description: Update phase, status, summary, cost or artifact of an agent run
      parameters:
      - description: Agent run ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateAgentRunRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AgentRun'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an agent run
      tags:
      - agent-runs
  /api/v1/agent-runs/{id}/approvals:
    get:
      description: Get the human decisions waiting on an agent run
      parameters:
      - description: Agent run ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AgentApproval'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List approvals for an agent run
      tags:
      - agent-runs
    post:
      consumes:
      - application/json
      description: Register a proposal that needs a human decision before it is applied
      parameters:
      - description: Agent run ID
        in: path
        name: id
        required: true
        type: integer
      - description: Approval
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateAgentApprovalRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AgentApproval'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Propose a change for human approval
      tags:
      - agent-runs
  /api/v1/agent-runs/{id}/cancel:
    post:
      description: Cancel a running or queued agent run. The agent stops and the cluster
        resources are cleaned up.
      parameters:
      - description: Agent run ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AgentRun'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cancel an agent run
      tags:
      - agent-runs
  /api/v1/agent-runs/{id}/events:
    get:
      description: Get the chronological event history for an agent run
      parameters:
      - description: Agent run ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AgentRunEvent'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List AgentRun events
      tags:
      - agent-runs
    post:
      consumes:
      - application/json
      description: Append a structured event to an agent run
      parameters:
      - description: Agent run ID
        in: path
        name: id
        required: true
        type: integer
      - description: Agent run event
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateAgentRunEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AgentRunEvent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Record an AgentRun event
      tags:
      - agent-runs
  /api/v1/agent-runs/{id}/usage:
    get:
      parameters:
      - description: Agent run ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AgentRunUsage'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get usage for an agent run
      tags:
      - agent-usage
    post:
      consumes:
      - application/json
