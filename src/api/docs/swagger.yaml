      tags:
      - api-keys
  /api/v1/approvals:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List pending approvals
      tags:
      - approvals
  /api/v1/approvals/{goal_id}:
    get:
      parameters:
      - description: Goal ID
