basePath: /
definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: seconds
        type: integer
      refresh_token:
        type: string
      token_type:
        description: '"Bearer"'
        type: string
      user:
        $ref: '#/definitions/auth.UserInfo'
    type: object
  auth.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: seconds
        type: integer
      refresh_token:
        type: string
      token_type:
        description: '"Bearer"'
        type: string
    type: object
  auth.UserInfo:
    properties:
      email:
        type: string
      id:
        type: string
      roles:
        items:
          type: string
        type: array
    type: object
  handlers.APIKey:
    properties:
      created:
        type: string
      expires:
        type: string
      id:
        type: integer
      last_used:
        type: string
      name:
        type: string
      scope:
        type: string
    type: object
  handlers.APIKeyResponse:
    properties:
      id:
        type: integer
      key:
        description: Only returned once!
        type: string
      name:
        type: string
      scope:
        type: string
    type: object
  handlers.AgentRunLifecycle:
    properties:
      needs_human:
        description: NeedsHuman är de tillstånd där en människa måste agera.
        example:
        - waiting_approval
        items:
          type: string
        type: array
      phases:
        description: Phases är faser i den ordning de sker.
        example:
        - define
        - plan
        - execute
        - verify
        - completed
        items:
          type: string
        type: array
      status:
        description: Status är de tillstånd en körning kan ha.
        example:
        - queued
        - running
        - waiting_approval
        - succeeded
        - failed
        - cancelled
        items:
          type: string
        type: array
      terminal:
        description: Terminal är de tillstånd en körning inte kan lämna.
        example:
        - done
        - failed
        - cancelled
        items:
          type: string
        type: array
      transitions:
        additionalProperties:
          items:
            type: string
          type: array
        description: Transitions visar vilka tillstånd ett tillstånd får övergå till.
        type: object
    type: object
  handlers.ApprovePlanRequest:
    properties:
      approvedBy:
        type: string
    type: object
  handlers.CancelRequest:
    description: Request to cancel a running tool execution
    properties:
      toolCallId:
        type: string
    required:
    - toolCallId
    type: object
  handlers.CancelResponse:
    description: Response from a cancel request
    properties:
      message:
        type: string
      success:
        type: boolean
      toolCallId:
        type: string
    type: object
  handlers.CreateAPIKeyRequest:
    properties:
      expires:
        description: RFC3339 format
        type: string
      name:
        type: string
      scope:
        description: |-
          Scope bestämmer vad nyckeln får göra. "full" ger samma rättigheter
          som en inloggad användare, "agent" begränsar nyckeln till agentens
          arbete med mål och körningar.
        type: string
    required:
    - name
    type: object
  handlers.CreateConversationRequest:
    properties:
      model:
        type: string
      provider:
        type: string
      title:
        type: string
    type: object
  handlers.CreateMessageRequest:
    properties:
      content:
        type: string
      goal_context:
        $ref: '#/definitions/handlers.GoalContext'
    type: object
  handlers.DecisionRequest:
    properties:
      decision:
        description: Decision is "approve" or "reject"
        type: string
      feedback:
        description: Feedback is optional - what the agent should change
        type: string
    required:
    - decision
    type: object
  handlers.GoalContext:
    properties:
      description:
        type: string
      id:
        type: integer
      title:
        type: string
    type: object
  handlers.SetAPIKeyRequest:
    properties:
      api_key:
        type: string
      model:
        type: string
      provider:
        type: string
    required:
    - api_key
    - provider
    type: object
  handlers.StartWorkflowRequest:
    properties:
      description:
        type: string
      feature:
        type: string
    required:
    - feature
    type: object
  handlers.SubmitDecisionRequest:
    properties:
      approved:
        type: boolean
      checkpointId:
        type: string
      feedback:
        type: string
    required:
    - checkpointId
    type: object
  handlers.UpdateConversationRequest:
    properties:
      title:
        type: string
    type: object
  models.AgentApproval:
    properties:
      agent_run_id:
        example: 12
        type: integer
      consequence:
        description: Consequence beskriver vad som händer om beslutet tas.
        type: string
      created_at:
        type: string
      decided_at:
        type: string
      decided_by:
        description: DecidedBy är användaren som fattade beslutet.
        type: integer
      description:
        example: Varför ändringen behövs
        type: string
      feedback:
        description: Feedback är människans motivering.
        type: string
      goal_id:
        example: 449
        type: integer
      id:
        example: 1
        type: integer
      payload:
        additionalProperties: {}
        description: |-
          Payload innehåller exakt det som föreslogs - de ändringar och det
          testkommando som ska köras. Utan det skulle agenten behöva generera
          om förslaget, och det som godkänns skulle inte vara det som appliceras.
        type: object
      status:
        description: Status är pending, approved eller rejected.
        example: pending
        type: string
      title:
        example: 'Förslag: lägg till sak i fil'
        type: string
      verification_plan:
        description: VerificationPlan beskriver hur resultatet ska kontrolleras.
        type: string
    type: object
  models.AgentBudget:
    properties:
      active:
        description: Active anger om budgeten gäller.
        type: boolean
      agent_id:
        description: AgentID gäller en enskild agent. Tom gäller alla.
        type: string
      created_at:
        type: string
      hard_limit_usd:
        description: HardLimitUSD stoppar nya körningar när gränsen nås.
        example: 10
        type: number
      id:
        example: 1
        type: integer
      name:
        example: Mars
        type: string
      period:
        description: Period är day, week eller month.
        example: month
        type: string
      reservation_per_run_usd:
        description: |-
          ReservationPerRunUSD är hur mycket en ny körning reserverar direkt.
          Det gör att samtidiga körningar inte tillsammans överskrider
          gränsen.
        example: 1
        type: number
      warning_limit_usd:
        description: WarningLimitUSD varnar utan att blockera.
        type: number
    type: object
  models.AgentRun:
    properties:
      agent_id:
        description: AgentID identifierar agenten som gjorde körningen.
        example: agent-worker-run-72
        type: string
      agent_profile:
        description: AgentProfile är vilken sorts agent som körde - coding eller life.
        example: coding
        type: string
      artifact_url:
        description: ArtifactURL pekar på resultatet - en PR-länk eller ett bokningsutkast.
        type: string
      conversation_id:
        description: ConversationID knytar körningen till en konversation i agent-tjänsten.
        type: string
      cost_usd:
        description: CostUSD är kostnaden för körningen hittills.
        type: number
      created_at:
        type: string
      finished_at:
        type: string
      goal_id:
        example: 449
        type: integer
      id:
        example: 1
        type: integer
      initiator:
        example: user:1
        type: string
      model:
        example: MiniMax-M2.7
        type: string
      model_version:
        description: ModelVersion är modellens version.
        type: string
      phase:
        example: define
        type: string
      provider:
        description: |-
          Provider och Model visar vilken modell som användes. Modellen
          behövs för att räkna fram kostnaden ur prislistan.
        example: minimax
        type: string
      reserved_cost_usd:
        description: |-
          ReservedCostUSD är den kostnad som reserverats för körningen så
          länge den pågår.
        example: 1
        type: number
      result:
        description: Result beskriver vad körningen ledde till.
        example: Målet definierat och flyttat till plan
        type: string
      started_at:
        description: StartedAt sätts när körningen börjar, FinishedAt när den är klar.
        type: string
      status:
        example: running
        type: string
      summary:
        example: Agenten specificerar målet
        type: string
      trigger:
        description: 'Trigger beskriver vad som startade körningen: user, schedule,
          webhook eller agent.'
        example: user
        type: string
      updated_at:
        type: string
    type: object
  models.AgentRunEvent:
    properties:
      agent_run_id:
        example: 12
        type: integer
      created_at:
        type: string
      id:
        example: 1
        type: integer
      payload:
        additionalProperties: {}
        type: object
      phase:
        example: execute
        type: string
      type:
        example: tool_call
        type: string
    type: object
  models.AgentRunUsage:
    properties:
      agent_id:
        description: AgentID identifierar agenten som gjorde körningen.
        example: agent-worker-run-72
        type: string
      agent_run_id:
        example: 12
        type: integer
      cache_read_tokens:
        example: 0
        type: integer
      cost_usd:
        description: CostUSD är den beräknade kostnaden.
        example: 0.0042
        type: number
      created_at:
        type: string
      currency:
        description: Currency är valutan kostnaden anges i.
        example: USD
        type: string
      finished_at:
        type: string
      goal_id:
        example: 42
        type: integer
      id:
        example: 1
        type: integer
      input_tokens:
        description: Tokenantal för de olika sorterna.
        example: 1200
        type: integer
      model:
        example: MiniMax-M2.7
        type: string
      model_version:
        description: ModelVersion är modellens version.
        type: string
      output_tokens:
        example: 800
        type: integer
      price_list_version:
        description: PriceListVersion visar vilken prislista som användes.
        example: 2026-11-24.1
        type: string
      price_source:
        description: |-
          PriceSource visar om priset kom från prislistan eller från en
          schablon.
        example: price_list
        type: string
      provider:
        description: Provider och Model visar vilken modell som användes.
        example: minimax
        type: string
      started_at:
        description: StartedAt och FinishedAt avgränsar körningen.
        type: string
      status:
        description: Status är "reported" eller "incomplete".
        example: reported
        type: string
      tool_calls:
        description: |-
          ToolCalls är antalet verktygsanrop och ToolNames de anropade
          verktygens namn.
        example: 4
        type: integer
      tool_names:
        items:
          type: string
        type: array
    type: object
  models.AgentUsageByModel:
    properties:
      cost_usd:
        example: 0.12
        type: number
      model:
        example: MiniMax-M2.7
        type: string
      provider:
        example: minimax
        type: string
      runs:
        example: 2
        type: integer
    type: object
  models.AgentUsageSummary:
    properties:
      by_model:
        description: ByModel bryter ner kostnaden per modell.
        items:
          $ref: '#/definitions/models.AgentUsageByModel'
        type: array
      cache_read_tokens:
        example: 0
        type: integer
      currency:
        description: Currency är valutan kostnaderna anges i.
        example: USD
        type: string
      input_tokens:
        description: InputTokens, OutputTokens och CacheReadTokens är summan av tokens.
        example: 12000
        type: integer
      output_tokens:
        example: 8000
        type: integer
      runs:
        description: Runs är antalet körningar i urvalet.
        example: 4
        type: integer
      tool_calls:
        description: ToolCalls är summan av verktygsanrop.
        example: 17
        type: integer
      total_cost_usd:
        description: TotalCostUSD är summan av körningarnas kostnad.
        example: 0.42
        type: number
    type: object
  models.BudgetStatus:
    properties:
      budget_id:
        example: 1
        type: integer
      exceeded:
        description: Exceeded är true om gränsen är nådd.
        type: boolean
      hard_limit_usd:
        description: |-
          HardLimitUSD, SpentUSD och ReservedUSD beskriver gränsen och vad
          som redan är använd eller reserverat.
        example: 10
        type: number
      name:
        example: Mars
        type: string
      period:
        example: month
        type: string
      reason:
        description: |-
          Reason förklarar varför körningen stoppades: "limit_reached" eller
          "unknown_price".
        example: limit_reached
        type: string
      reserved_usd:
        example: 1
        type: number
      spent_usd:
        example: 8.5
        type: number
      warning:
        description: Warning är true om varningsgränsen är nådd.
        type: boolean
    type: object
  models.Calendar:
    properties:
      color:
        type: string
      created_at:
        type: string
      icon:
        type: string
      id:
        type: integer
      is_default:
        description: |-
          IsDefault gör kalendern till användarens standardkalender. Nya
          händelser hamnar där om ingen kalender väljs uttryckligen.
        type: boolean
      name:
        type: string
      sort_order:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  models.CalendarEvent:
    properties:
      all_day:
        type: boolean
      calendar_id:
        description: |-
          CalendarID pekar på den kalender händelsen ligger i. Nil betyder att
          händelsen inte tillhör någon kalender.
        type: integer
      created_at:
        type: string
      description:
        type: string
      end_at:
        type: string
      goal_id:
        type: integer
      icon:
        description: "Icon är en emoji (t.ex. \"\U0001F3C3\") eller ett Iconify-namn
          (t.ex.\n\"heroicons:star\"). Det är valfritt och används bara för visning."
        type: string
      id:
        type: integer
      occurrence_id:
        type: string
      original_start_at:
        type: string
      parent_event_id:
        type: integer
      places:
        description: |-
          Places är de platser där händelsen sker. En händelse kan ha flera
          platser. Skickas alltid ut, även när listan är tom.
        items:
          $ref: '#/definitions/models.Place'
        type: array
      recurrence_rule:
        type: string
      start_at:
        type: string
      status:
        type: string
      time_zone:
        type: string
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  models.ChildRelation:
    properties:
      child_id:
        example: 2
        type: integer
      order:
        example: 0
        type: integer
      weight:
        example: 10
        type: integer
    type: object
  models.ChildWithDeps:
    properties:
      agent:
        description: |-
          Agent markerar ett mål som är avsett att arbeta på av en agent.
          Används för att filtrera fram vilka mål en agent kan ta sig an.
        example: false
        type: boolean
      blocking:
        items:
          $ref: '#/definitions/models.Goal'
        type: array
      created:
        type: string
      dependsOn:
        items:
          $ref: '#/definitions/models.Goal'
        type: array
      description:
        description: |-
          Description är en längre fritext om målet. Används när titeln
          inte räcker för att beskriva vad som ska uppnås.
        example: En längre beskrivning av målet
        type: string
      due:
        allOf:
        - $ref: '#/definitions/models.DueDate'
        description: |-
          Due är det datum målet ska vara klart. Skickas alltid ut, även när
          det är null - samma resonemang som för started/finished.
      estimated_minutes:
        description: |-
          EstimatedMinutes är den uppskattade tidsåtgången för målet, i minuter.
          Null = ingen uppskattning satt. Skickas alltid ut, även när den är
          null - samma resonemang som för started/finished.
        type: integer
      eternal:
        description: |-
          Eternal marks a goal that never ends (t.ex. "kroppen"). Ett evigt mål
          kan inte slutföras och markeras alltid som pågående.
        example: false
        type: boolean
      finished:
        type: string
      has_parent:
        description: |-
          HasParent anger om målet har en förälder (det är child i goal_relations).
          Endast grundmål (utan förälder) listas på /goals.
        example: false
        type: boolean
      icon:
        example: heroicons:star
        type: string
      id:
        example: 1
        type: integer
      inbox:
        example: 0
        type: integer
      now:
        description: |-
          Now markerar ett mål som ska göras nu. Målet dyker då upp på
          "Gör nu"-sidan (i stället för de mål som bara är påbörjade).
        example: false
        type: boolean
      order:
        type: integer
      places:
        description: |-
          Places är de platser där målet kan slutföras. Ett mål kan ha flera
          platser - då räcker det att vara på någon av dem (OR-semantik).
          Skickas alltid ut, även när listan är tom.
        items:
          $ref: '#/definitions/models.Place'
        type: array
      recurrence_count:
        description: RecurrenceCount är antalet slutförda förekomster.
        type: integer
      recurrence_mode:
        description: |-
          RecurrenceMode är schemaläggningsstrategin: "schedule" (håll
          schemat) eller "push" (skjuta fram nästa förekomst).
        type: string
      recurrence_next:
        allOf:
        - $ref: '#/definitions/models.DueDate'
        description: |-
          RecurrenceNext är datumet för nästa förekomst som ska slutföras.
          Null = serien är slut och målet har inget mer att göra.
      recurrence_rule:
        description: |-
          RecurrenceRule är upprepningsregeln för ett återkommande mål, som
          en RRULE-sträng. Null = målet är inte återkommande.
        type: string
      start_date:
        allOf:
        - $ref: '#/definitions/models.DueDate'
        description: |-
          StartDate är det datum målet tidigast får dyka upp i
          prioriteringslistan. Null = målet får synas direkt.

          Det är ett annat datum än started: started säger att arbetet har
          börjat, startDate säger att målet inte får prioriteras ännu.
          Skickas alltid ut, även när det är null.
      started:
        description: |-
          Started och Finished skickas alltid ut, även när de är null.
          Med omitempty skulle fältet försvinna ur JSON-svaret och klienten
          fick undefined i stället för null - vilket gjorde att filter som
          "started !== null" felaktigt matchade mål utan startdatum.
        type: string
      status_id:
        example: 1
        type: integer
      tags:
        description: |-
          Tags är etiketter på målet ("ute", "hem", "vinter"). Taggarna
          hör till användaren och skapas på demand när man skriver in ett
          nytt namn. Skickas alltid ut, även när listan är tom.
        items:
          type: string
        type: array
      title:
        example: My Goal
        type: string
      weight:
        type: integer
    type: object
  models.CompleteGoalRequest:
    properties:
      reason:
        example: klart
        type: string
    type: object
  models.CompleteOccurrenceRequest:
    properties:
      completed_on:
        description: |-
          CompletedOn är det datum slutförandet skedde ("YYYY-MM-DD"). Utan
          det används dagens datum.
        example: "2026-01-05"
        type: string
      occurrence_date:
        description: |-
          OccurrenceDate är den förekomst som slutförs ("YYYY-MM-DD"). Utan
          det slutförs målets aktuella förekomst. Skickas det en förekomst
          som redan är slutförd ändras ingenting.
        example: "2026-01-01"
        type: string
    type: object
  models.CreateAgentApprovalRequest:
    properties:
      consequence:
        description: Consequence beskriver vad som händer om beslutet tas.
        type: string
      description:
        description: Description förklarar varför förslaget finns.
        type: string
      payload:
        additionalProperties: {}
        description: Payload innehåller exakt det som föreslogs.
        type: object
      title:
        type: string
      verification_plan:
        description: VerificationPlan beskriver hur resultatet ska kontrolleras.
        type: string
    required:
    - title
    type: object
  models.CreateAgentBudgetRequest:
    properties:
      agent_id:
        type: string
      hard_limit_usd:
        type: number
      name:
        type: string
      period:
        type: string
      reservation_per_run_usd:
        type: number
      warning_limit_usd:
        type: number
    type: object
  models.CreateAgentRunEventRequest:
    properties:
      payload:
        additionalProperties: {}
        type: object
      phase:
        type: string
      type:
        type: string
    required:
    - type
    type: object
  models.CreateAgentRunRequest:
    properties:
      agent_id:
        description: AgentID identifierar agenten.
        type: string
      agent_profile:
        type: string
      artifact_url:
        type: string
      conversation_id:
        type: string
      goal_id:
        type: integer
      initiator:
        type: string
      model:
        type: string
      model_version:
        type: string
      phase:
        type: string
      provider:
        description: Provider och Model behövs för att prissätta körningen.
        type: string
      result:
        type: string
      started_at:
        description: StartedAt sätts när körningen börjar. Nil ger "nu".
        type: string
      status:
        type: string
      summary:
        type: string
      trigger:
        type: string
    required:
    - goal_id
    type: object
  models.CreateAgentRunUsageRequest:
    properties:
      agent_id:
        type: string
      cache_read_tokens:
        description: CacheReadTokens är tokens som lästs från modellens cache.
        type: integer
      finished_at:
        type: string
      input_tokens:
        type: integer
      model:
        type: string
      model_version:
        type: string
      output_tokens:
        type: integer
      provider:
        description: Provider och Model används för att hitta priset i prislistan.
        type: string
      started_at:
        type: string
      tool_calls:
        type: integer
      tool_names:
        items:
          type: string
        type: array
    type: object
  models.CreateCalendarEventRequest:
    properties:
      all_day:
        type: boolean
      calendar_id:
        description: |-
          CalendarID anger vilken kalender händelsen ska ligga i. Nil lämnar
          händelsen utan kalender.
        type: integer
      description:
        type: string
      end_at:
        type: string
      goal_id:
        type: integer
      icon:
        type: string
      recurrence_rule:
        type: string
      start_at:
        type: string
      status:
        type: string
      time_zone:
        type: string
      title:
        type: string
    required:
    - end_at
    - start_at
    - title
    type: object
  models.CreateCalendarOccurrenceRequest:
    properties:
      all_day:
        type: boolean
      calendar_id:
        type: integer
      description:
        type: string
      end_at:
        type: string
      goal_id:
        type: integer
      icon:
        type: string
