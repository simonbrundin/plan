basePath: /
definitions:
  internal_handlers.APIKey:
    properties:
      created:
        type: string
      expires:
        type: string
      id:
        type: integer
      last_used:
        type: string
      name:
        type: string
    type: object
  internal_handlers.APIKeyResponse:
    properties:
      id:
        type: integer
      key:
        description: Only returned once!
        type: string
      name:
        type: string
    type: object
  internal_handlers.CreateAPIKeyRequest:
    properties:
      expires:
        description: RFC3339 format
        type: string
      name:
        type: string
    required:
    - name
    type: object
  plan-api_internal_models.Calendar:
    properties:
      color:
        type: string
      created_at:
        type: string
      icon:
        type: string
      id:
        type: integer
      is_default:
        description: |-
          IsDefault gör kalendern till användarens standardkalender. Nya
          händelser hamnar där om ingen kalender väljs uttryckligen.
        type: boolean
      name:
        type: string
      sort_order:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  plan-api_internal_models.CalendarEvent:
    properties:
      all_day:
        type: boolean
      calendar_id:
        description: |-
          CalendarID pekar på den kalender händelsen ligger i. Nil betyder att
          händelsen inte tillhör någon kalender.
        type: integer
      created_at:
        type: string
      description:
        type: string
      end_at:
        type: string
      goal_id:
        type: integer
      icon:
        description: "Icon är en emoji (t.ex. \"\U0001F3C3\") eller ett Iconify-namn
          (t.ex.\n\"heroicons:star\"). Det är valfritt och används bara för visning."
        type: string
      id:
        type: integer
      occurrence_id:
        type: string
      original_start_at:
        type: string
      parent_event_id:
        type: integer
      places:
        description: |-
          Places är de platser där händelsen sker. En händelse kan ha flera
          platser. Skickas alltid ut, även när listan är tom.
        items:
          $ref: '#/definitions/plan-api_internal_models.Place'
        type: array
      recurrence_rule:
        type: string
      start_at:
        type: string
      status:
        type: string
      time_zone:
        type: string
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  plan-api_internal_models.ChildRelation:
    properties:
      child_id:
        example: 2
        type: integer
      order:
        example: 0
        type: integer
      weight:
        example: 10
        type: integer
    type: object
  plan-api_internal_models.ChildWithDeps:
    properties:
      blocking:
        items:
          $ref: '#/definitions/plan-api_internal_models.Goal'
        type: array
      created:
        type: string
      dependsOn:
        items:
          $ref: '#/definitions/plan-api_internal_models.Goal'
        type: array
      description:
        description: |-
          Description är en längre fritext om målet. Används när titeln
          inte räcker för att beskriva vad som ska uppnås.
        example: En längre beskrivning av målet
        type: string
      due:
        allOf:
        - $ref: '#/definitions/plan-api_internal_models.DueDate'
        description: |-
          Due är det datum målet ska vara klart. Skickas alltid ut, även när
          det är null - samma resonemang som för started/finished.
      eternal:
        description: |-
          Eternal marks a goal that never ends (t.ex. "kroppen"). Ett evigt mål
          kan inte slutföras och markeras alltid som pågående.
        example: false
        type: boolean
      finished:
        type: string
      has_parent:
        description: |-
          HasParent anger om målet har en förälder (det är child i goal_relations).
          Endast grundmål (utan förälder) listas på /goals.
        example: false
        type: boolean
      icon:
        example: heroicons:star
        type: string
      id:
        example: 1
        type: integer
      inbox:
        example: 0
        type: integer
      order:
        type: integer
      places:
        description: |-
          Places är de platser där målet kan slutföras. Ett mål kan ha flera
          platser - då räcker det att vara på någon av dem (OR-semantik).
          Skickas alltid ut, även när listan är tom.
        items:
          $ref: '#/definitions/plan-api_internal_models.Place'
        type: array
      recurrence_count:
        description: RecurrenceCount är antalet slutförda förekomster.
        type: integer
      recurrence_mode:
        description: |-
          RecurrenceMode är schemaläggningsstrategin: "schedule" (håll
          schemat) eller "push" (skjuta fram nästa förekomst).
        type: string
      recurrence_next:
        allOf:
        - $ref: '#/definitions/plan-api_internal_models.DueDate'
        description: |-
          RecurrenceNext är datumet för nästa förekomst som ska slutföras.
          Null = serien är slut och målet har inget mer att göra.
      recurrence_rule:
        description: |-
          RecurrenceRule är upprepningsregeln för ett återkommande mål, som
          en RRULE-sträng. Null = målet är inte återkommande.
        type: string
      start_date:
        allOf:
        - $ref: '#/definitions/plan-api_internal_models.DueDate'
        description: |-
          StartDate är det datum målet tidigast får dyka upp i
          prioriteringslistan. Null = målet får synas direkt.

          Det är ett annat datum än started: started säger att arbetet har
          börjat, startDate säger att målet inte får prioriteras ännu.
          Skickas alltid ut, även när det är null.
      started:
        description: |-
          Started och Finished skickas alltid ut, även när de är null.
          Med omitempty skulle fältet försvinna ur JSON-svaret och klienten
          fick undefined i stället för null - vilket gjorde att filter som
          "started !== null" felaktigt matchade mål utan startdatum.
        type: string
      status_id:
        example: 1
        type: integer
      title:
        example: My Goal
        type: string
      weight:
        type: integer
    type: object
  plan-api_internal_models.CompleteOccurrenceRequest:
    properties:
      completed_on:
        description: |-
          CompletedOn är det datum slutförandet skedde ("YYYY-MM-DD"). Utan
          det används dagens datum.
        example: "2026-01-05"
        type: string
      occurrence_date:
        description: |-
          OccurrenceDate är den förekomst som slutförs ("YYYY-MM-DD"). Utan
          det slutförs målets aktuella förekomst. Skickas det en förekomst
          som redan är slutförd ändras ingenting.
        example: "2026-01-01"
        type: string
    type: object
  plan-api_internal_models.CreateCalendarEventRequest:
    properties:
      all_day:
        type: boolean
      calendar_id:
        description: |-
          CalendarID anger vilken kalender händelsen ska ligga i. Nil lämnar
          händelsen utan kalender.
        type: integer
      description:
        type: string
      end_at:
        type: string
      goal_id:
        type: integer
      icon:
        type: string
      recurrence_rule:
        type: string
      start_at:
        type: string
      status:
        type: string
      time_zone:
        type: string
      title:
        type: string
    required:
    - end_at
    - start_at
    - title
    type: object
  plan-api_internal_models.CreateCalendarOccurrenceRequest:
    properties:
      all_day:
        type: boolean
      calendar_id:
        type: integer
      description:
        type: string
      end_at:
        type: string
      goal_id:
        type: integer
      icon:
        type: string
      original_start_at:
        type: string
      start_at:
        type: string
      status:
        type: string
      time_zone:
        type: string
      title:
        type: string
    required:
    - end_at
    - original_start_at
    - start_at
    type: object
  plan-api_internal_models.CreateDependencyRequest:
    properties:
      dependsOnId:
        example: 2
        type: integer
      goalId:
        example: 3
        type: integer
    required:
    - dependsOnId
    - goalId
    type: object
  plan-api_internal_models.CreateGoalRequest:
    properties:
      icon:
        example: heroicons:star
        type: string
      recurrence_mode:
        description: |-
          RecurrenceMode är schemaläggningsstrategin: "schedule" eller "push".
          Utan den används "schedule".
        example: schedule
        type: string
      recurrence_rule:
        description: RecurrenceRule gör målet återkommande direkt ("FREQ=DAILY;INTERVAL=2").
        example: FREQ=DAILY;INTERVAL=2
        type: string
      recurrence_start_date:
        description: |-
          RecurrenceStartDate är det datum serien startar på ("YYYY-MM-DD").
          Utan den används dagens datum.
        example: "2026-01-05"
        type: string
      start_date:
        description: |-
          StartDate är det datum målet tidigast får dyka upp i
          prioriteringslistan ("YYYY-MM-DD"). Utan det får målet synas direkt.
        example: "2026-01-05"
        type: string
      status_id:
        example: 1
        type: integer
      title:
        example: New Goal
        type: string
    required:
    - title
    type: object
  plan-api_internal_models.CreatePlaceRequest:
    properties:
