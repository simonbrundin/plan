apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: plan-db
  namespace: plan
spec:
  instances: 1

  bootstrap:
    initdb:
      database: plan
      owner: admin
      # Applikationsrollen ("plan") ska kunna skapa och äga tabellerna -
      # annars saknar API:t INSERT/UPDATE på t.ex. users och kan inte
      # skapa sessioner. Schemat appliceras av Atlas som samma roll.
      postInitSQL:
        - "GRANT ALL ON SCHEMA public TO plan"
        - "ALTER DEFAULT PRIVILEGES FOR ROLE admin IN SCHEMA public GRANT ALL ON TABLES TO plan"
        - "ALTER DEFAULT PRIVILEGES FOR ROLE admin IN SCHEMA public GRANT ALL ON SEQUENCES TO plan"

  storage:
    storageClass: cnpg
    size: 1Gi
    resizeInUseVolumes: true
  monitoring:
    enablePodMonitor: true

  managed:
    roles:
      - name: admin
        ensure: present
        login: true
        superuser: true
        passwordSecret:
          name: plan-db-admin
      - name: plan
        ensure: present
        login: true
        passwordSecret:
          name: plan-db-user
