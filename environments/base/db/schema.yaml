# Kanoniskt schema för alla miljöer (dev, pr, prod).
# Använd detta - inte en egen kopia - i overlays, annars skapar de
# två ConfigMap:ar med samma namn (kustomize duplicerar samma ID).
apiVersion: v1
kind: ConfigMap
metadata:
  name: plan-db-schema
data:
  schema.sql: "-- Schema for Plan app\n\nCREATE TABLE \"users\" (\n  \"id\" INTEGER NOT NULL UNIQUE GENERATED BY DEFAULT AS IDENTITY,\n  \"sub\" VARCHAR(255) NOT NULL UNIQUE,\n  \"email\" VARCHAR(40) NOT NULL UNIQUE,\n  \"first_name\" VARCHAR(16),\n  \"last_name\" VARCHAR(40),\n  \"created\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY(\"id\")\n);\n\nCREATE TABLE \"statuses\" (\n  \"id\" INTEGER NOT NULL UNIQUE GENERATED BY DEFAULT AS IDENTITY,\n  \"name\" VARCHAR(32) NOT NULL UNIQUE,\n  \"label\" VARCHAR(64) NOT NULL,\n  \"created\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY(\"id\")\n);\n\nCREATE TABLE \"goals\" (\n  \"id\" INTEGER NOT NULL UNIQUE GENERATED BY DEFAULT AS IDENTITY,\n  \"title\" VARCHAR(64),\n  \"icon\" VARCHAR(100) DEFAULT 'heroicons:star',\n  \"status_id\" INTEGER DEFAULT 1 NOT NULL,\n  \"created\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  \"started\" TIMESTAMPTZ,\n  \"finished\" TIMESTAMPTZ,\n  \"inbox\" INTEGER DEFAULT 1 NOT NULL,\n  PRIMARY KEY(\"id\"),\n  FOREIGN KEY(\"status_id\") REFERENCES \"statuses\"(\"id\")\n);\n\nCREATE TABLE \"user_goals\" (\n  \"user_id\" INTEGER NOT NULL,\n  \"goal_id\" INTEGER NOT NULL,\n  PRIMARY KEY(\"user_id\", \"goal_id\")\n);\n\nCREATE TABLE \"goal_relations\" (\n  \"parent_id\" INTEGER NOT NULL,\n  \"child_id\" INTEGER NOT NULL,\n  \"order\" INTEGER NOT NULL DEFAULT 0,\n  \"weight\" INTEGER NOT NULL DEFAULT 10,\n  PRIMARY KEY(\"parent_id\", \"child_id\")\n);\n\nALTER TABLE \"user_goals\"\nADD FOREIGN KEY(\"user_id\") REFERENCES \"users\"(\"id\")\nON UPDATE NO ACTION ON DELETE CASCADE;\n\nALTER TABLE \"user_goals\"\nADD FOREIGN KEY(\"goal_id\") REFERENCES \"goals\"(\"id\")\nON UPDATE NO ACTION ON DELETE CASCADE;\n\nALTER TABLE \"goal_relations\"\nADD FOREIGN KEY(\"parent_id\") REFERENCES \"goals\"(\"id\")\nON UPDATE NO ACTION ON DELETE CASCADE;\n\nALTER TABLE \"goal_relations\"\nADD FOREIGN KEY(\"child_id\") REFERENCES \"goals\"(\"id\")\nON UPDATE NO ACTION ON DELETE CASCADE;\n\n-- Dependencies: X must be completed before Y can start\nCREATE TABLE \"goal_dependencies\" (\n  \"id\" INTEGER NOT NULL UNIQUE GENERATED BY DEFAULT AS IDENTITY,\n  \"goal_id\" INTEGER NOT NULL,           -- the goal that depends on another\n  \"depends_on_id\" INTEGER NOT NULL,    -- the goal that must be completed first\n  \"created\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY(\"goal_id\", \"depends_on_id\"),\n  CONSTRAINT no_self_reference CHECK (goal_id != depends_on_id)\n);\n\nALTER TABLE \"goal_dependencies\"\nADD FOREIGN KEY(\"goal_id\") REFERENCES \"goals\"(\"id\")\nON UPDATE NO ACTION ON DELETE CASCADE;\n\nALTER TABLE \"goal_dependencies\"\nADD FOREIGN KEY(\"depends_on_id\") REFERENCES \"goals\"(\"id\")\nON UPDATE NO ACTION ON DELETE CASCADE;\n\n-- Status updates: history of status changes for goals\nCREATE TABLE \"status_updates\" (\n  \"id\" INTEGER NOT NULL UNIQUE GENERATED BY DEFAULT AS IDENTITY,\n  \"goal_id\" INTEGER NOT NULL,\n  \"from_status_id\" INTEGER REFERENCES \"statuses\"(\"id\"),\n  \"to_status_id\" INTEGER NOT NULL REFERENCES \"statuses\"(\"id\"),\n  \"changed_at\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY(\"id\")\n);\n\nALTER TABLE \"status_updates\"\nADD FOREIGN KEY(\"goal_id\") REFERENCES \"goals\"(\"id\")\nON UPDATE NO ACTION ON DELETE CASCADE;\n\n-- Sessions: User sessions for authentication\nCREATE TABLE \"sessions\" (\n  \"token\" TEXT PRIMARY KEY,\n  \"user_id\" BIGINT NOT NULL,\n  \"sub\" TEXT NOT NULL,\n  \"email\" TEXT NOT NULL,\n  \"created_at\" TIMESTAMPTZ NOT NULL,\n  \"expires_at\" TIMESTAMPTZ NOT NULL\n);\n\nALTER TABLE \"sessions\"\nADD FOREIGN KEY(\"user_id\") REFERENCES \"users\"(\"id\")\nON UPDATE NO ACTION ON DELETE CASCADE;\n\n-- Seed: Statuses\nINSERT INTO statuses (name, label) VALUES\n  ('define', 'Defining'),\n  ('plan', 'Planning'),\n  ('execute', 'Executing'),\n  ('verify', 'Verifying'),\n  ('completed', 'Completed')\nON CONFLICT DO NOTHING;\n\n-- Seed: Root goal\nINSERT INTO goals (id, title, icon) VALUES (1, 'Root', 'heroicons:home') ON CONFLICT DO NOTHING;\n\n-- The seed uses an explicit id, which leaves the identity sequence at 1.\n-- Without this the first insert from the app collides with the Root goal.\nSELECT setval(pg_get_serial_sequence('goals', 'id'), (SELECT COALESCE(MAX(id), 0) + 1 FROM goals));\n\n-- NOTE: Atlas applies the schema declaratively (DDL only), so the INSERT\n-- statements above are not executed by the operator. The application\n-- seeds the same rows itself on start (see internal/database/seed.go).\n\n-- API Keys for programmatic access (agents, integrations)\nCREATE TABLE IF NOT EXISTS \"api_keys\" (\n  \"id\" INTEGER NOT NULL UNIQUE GENERATED BY DEFAULT AS IDENTITY,\n  \"name\" VARCHAR(100) NOT NULL,\n  \"key_hash\" VARCHAR(255) NOT NULL UNIQUE,\n  \"user_id\" INTEGER,\n  \"created\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  \"last_used\" TIMESTAMPTZ,\n  \"expires\" TIMESTAMPTZ,\n  PRIMARY KEY(\"id\"),\n  FOREIGN KEY(\"user_id\") REFERENCES \"users\"(\"id\") ON DELETE SET NULL\n);\n"
