# Kanoniskt schema för alla miljöer (dev, pr, prod).
# Använd detta - inte en egen kopia - i overlays, annars skapar de
# två ConfigMap:ar med samma namn (kustomize duplicerar samma ID).
apiVersion: v1
kind: ConfigMap
metadata:
  name: plan-db-schema
data:
  schema.sql: "-- Schema for Plan app\n\nCREATE TABLE \"users\" (\n  \"id\" INTEGER NOT NULL UNIQUE GENERATED BY DEFAULT AS IDENTITY,\n  \"sub\" VARCHAR(255) NOT NULL UNIQUE,\n  \"email\" VARCHAR(40) NOT NULL UNIQUE,\n  \"first_name\" VARCHAR(16),\n  \"last_name\" VARCHAR(40),\n  \"created\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY(\"id\")\n);\n\nCREATE TABLE \"statuses\" (\n  \"id\" INTEGER NOT NULL UNIQUE GENERATED BY DEFAULT AS IDENTITY,\n  \"name\" VARCHAR(32) NOT NULL UNIQUE,\n  \"label\" VARCHAR(64) NOT NULL,\n  \"created\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY(\"id\")\n);\n\nCREATE TABLE \"goals\" (\n  \"id\" INTEGER NOT NULL UNIQUE GENERATED BY DEFAULT AS IDENTITY,\n  \"title\" VARCHAR(64),\n  \"description\" TEXT,\n  \"icon\" VARCHAR(100) DEFAULT 'heroicons:star',\n  \"status_id\" INTEGER DEFAULT 1 NOT NULL,\n  \"created\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  \"started\" TIMESTAMPTZ,\n  \"finished\" TIMESTAMPTZ,\n  \"due\" DATE,\n  \"start_date\" DATE,\n  \"estimated_minutes\" INTEGER,\n  \"inbox\" INTEGER DEFAULT 1 NOT NULL,\n  \"eternal\" BOOLEAN NOT NULL DEFAULT FALSE,\n  \"agent\" BOOLEAN NOT NULL DEFAULT FALSE,\n  \"now\" BOOLEAN NOT NULL DEFAULT FALSE,\n  \"order\" INTEGER NOT NULL DEFAULT 0,\n  \"priority_order\" INTEGER NOT NULL DEFAULT 0,\n  \"recurrence_rule\" TEXT,\n  \"recurrence_mode\" TEXT,\n  \"recurrence_anchor\" DATE,\n  \"recurrence_next\" DATE,\n  CONSTRAINT goals_valid_recurrence_mode CHECK (\"recurrence_mode\" IS NULL OR \"recurrence_mode\" IN ('schedule', 'push')),\n  PRIMARY KEY(\"id\"),\n  FOREIGN KEY(\"status_id\") REFERENCES \"statuses\"(\"id\")\n);\n\nCREATE TABLE \"user_goals\" (\n  \"user_id\" INTEGER NOT NULL,\n  \"goal_id\" INTEGER NOT NULL,\n  PRIMARY KEY(\"user_id\", \"goal_id\")\n);\n\nCREATE TABLE \"goal_relations\" (\n  \"parent_id\" INTEGER NOT NULL,\n  \"child_id\" INTEGER NOT NULL,\n  \"order\" INTEGER NOT NULL DEFAULT 0,\n  \"weight\" INTEGER NOT NULL DEFAULT 10,\n  PRIMARY KEY(\"parent_id\", \"child_id\")\n);\n\nALTER TABLE \"user_goals\"\nADD FOREIGN KEY(\"user_id\") REFERENCES \"users\"(\"id\")\nON UPDATE NO ACTION ON DELETE CASCADE;\n\nALTER TABLE \"user_goals\"\nADD FOREIGN KEY(\"goal_id\") REFERENCES \"goals\"(\"id\")\nON UPDATE NO ACTION ON DELETE CASCADE;\n\nALTER TABLE \"goal_relations\"\nADD FOREIGN KEY(\"parent_id\") REFERENCES \"goals\"(\"id\")\nON UPDATE NO ACTION ON DELETE CASCADE;\n\nALTER TABLE \"goal_relations\"\nADD FOREIGN KEY(\"child_id\") REFERENCES \"goals\"(\"id\")\nON UPDATE NO ACTION ON DELETE CASCADE;\n\n-- Dependencies: X must be completed before Y can start\nCREATE TABLE \"goal_dependencies\" (\n  \"id\" INTEGER NOT NULL UNIQUE GENERATED BY DEFAULT AS IDENTITY,\n  \"goal_id\" INTEGER NOT NULL,           -- the goal that depends on another\n  \"depends_on_id\" INTEGER NOT NULL,    -- the goal that must be completed first\n  \"created\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY(\"goal_id\", \"depends_on_id\"),\n  CONSTRAINT no_self_reference CHECK (goal_id != depends_on_id)\n);\n\nALTER TABLE \"goal_dependencies\"\nADD FOREIGN KEY(\"goal_id\") REFERENCES \"goals\"(\"id\")\nON UPDATE NO ACTION ON DELETE CASCADE;\n\nALTER TABLE \"goal_dependencies\"\nADD FOREIGN KEY(\"depends_on_id\") REFERENCES \"goals\"(\"id\")\nON UPDATE NO ACTION ON DELETE CASCADE;\n\n-- Status updates: history of status changes for goals\nCREATE TABLE \"status_updates\" (\n  \"id\" INTEGER NOT NULL UNIQUE GENERATED BY DEFAULT AS IDENTITY,\n  \"goal_id\" INTEGER NOT NULL,\n  \"from_status_id\" INTEGER REFERENCES \"statuses\"(\"id\"),\n  \"to_status_id\" INTEGER NOT NULL REFERENCES \"statuses\"(\"id\"),\n  \"changed_at\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY(\"id\")\n);\n\nALTER TABLE \"status_updates\"\nADD FOREIGN KEY(\"goal_id\") REFERENCES \"goals\"(\"id\")\nON UPDATE NO ACTION ON DELETE CASCADE;\n\n-- Sessions: User sessions for authentication\nCREATE TABLE \"sessions\" (\n  \"token\" TEXT PRIMARY KEY,\n  \"user_id\" BIGINT NOT NULL,\n  \"sub\" TEXT NOT NULL,\n  \"email\" TEXT NOT NULL,\n  \"created_at\" TIMESTAMPTZ NOT NULL,\n  \"expires_at\" TIMESTAMPTZ NOT NULL\n);\n\nALTER TABLE \"sessions\"\nADD FOREIGN KEY(\"user_id\") REFERENCES \"users\"(\"id\")\nON UPDATE NO ACTION ON DELETE CASCADE;\n\n-- Seed: Statuses\nINSERT INTO statuses (name, label) VALUES\n  ('define', 'Defining'),\n  ('plan', 'Planning'),\n  ('execute', 'Executing'),\n  ('verify', 'Verifying'),\n  ('completed', 'Completed')\nON CONFLICT DO NOTHING;\n\n-- Seed: Root goal\nINSERT INTO goals (id, title, icon) VALUES (1, 'Root', 'heroicons:home') ON CONFLICT DO NOTHING;\n\n-- The seed uses an explicit id, which leaves the identity sequence at 1.\n-- Without this the first insert from the app collides with the Root goal.\nSELECT setval(pg_get_serial_sequence('goals', 'id'), (SELECT COALESCE(MAX(id), 0) + 1 FROM goals));\n\n-- NOTE: Atlas applies the schema declaratively (DDL only), so the INSERT\n-- statements above are not executed by the operator. The application\n-- seeds the same rows itself on start (see internal/database/seed.go).\n\n-- Kalendrar. En användare kan skapa hur manya som helst, och varje\n-- kalender har en egen färg. Händelser i en kalender ärver kalenderns\n-- färg om de inte har en egen färg satt.\nCREATE TABLE \"calendars\" (\n  \"id\" BIGINT NOT NULL GENERATED BY DEFAULT AS IDENTITY,\n  \"user_id\" INTEGER NOT NULL,\n  \"name\" VARCHAR(64) NOT NULL,\n  \"color\" VARCHAR(7) NOT NULL DEFAULT '#6366f1',\n  \"icon\" VARCHAR(100),\n  \"is_default\" BOOLEAN NOT NULL DEFAULT FALSE,\n  \"sort_order\" INTEGER NOT NULL DEFAULT 0,\n  \"created_at\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  \"updated_at\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY (\"id\"),\n  FOREIGN KEY (\"user_id\") REFERENCES \"users\"(\"id\") ON DELETE CASCADE\n);\n\nCREATE INDEX \"calendars_user_idx\"\n  ON \"calendars\" (\"user_id\", \"sort_order\", \"id\");\n\n-- Endast en kalender per användare kan vara standardkalender.\nCREATE UNIQUE INDEX \"calendars_user_default_idx\"\n  ON \"calendars\" (\"user_id\")\n  WHERE \"is_default\";\n\n-- Calendar events. start_at is inclusive and end_at is exclusive.\n-- time_zone stores an IANA zone (for example Europe/Stockholm), while the\n-- timestamptz columns preserve the absolute instants used for querying.\nCREATE TABLE \"calendar_events\" (\n  \"id\" BIGINT NOT NULL GENERATED BY DEFAULT AS IDENTITY,\n  \"user_id\" INTEGER NOT NULL,\n  \"goal_id\" BIGINT,\n  \"calendar_id\" BIGINT,\n  \"title\" VARCHAR(255) NOT NULL,\n  \"description\" TEXT,\n  \"icon\" VARCHAR(100),\n  \"start_at\" TIMESTAMPTZ NOT NULL,\n  \"end_at\" TIMESTAMPTZ NOT NULL,\n  \"time_zone\" VARCHAR(64) NOT NULL DEFAULT 'UTC',\n  \"all_day\" BOOLEAN NOT NULL DEFAULT FALSE,\n  \"status\" VARCHAR(16) NOT NULL DEFAULT 'confirmed',\n  \"recurrence_rule\" TEXT,\n  \"parent_event_id\" BIGINT,\n  \"original_start_at\" TIMESTAMPTZ,\n  \"created_at\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  \"updated_at\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY (\"id\"),\n  CONSTRAINT calendar_events_valid_time CHECK (\"end_at\" > \"start_at\"),\n  CONSTRAINT calendar_events_valid_status CHECK (\"status\" IN ('confirmed', 'tentative', 'cancelled')),\n  CONSTRAINT calendar_events_valid_recurrence_override CHECK (\n    (\"parent_event_id\" IS NULL AND \"original_start_at\" IS NULL)\n    OR (\"parent_event_id\" IS NOT NULL AND \"original_start_at\" IS NOT NULL)\n  ),\n  FOREIGN KEY (\"user_id\") REFERENCES \"users\"(\"id\") ON DELETE CASCADE,\n  FOREIGN KEY (\"goal_id\") REFERENCES \"goals\"(\"id\") ON DELETE SET NULL,\n  FOREIGN KEY (\"calendar_id\") REFERENCES \"calendars\"(\"id\") ON DELETE SET NULL,\n  FOREIGN KEY (\"parent_event_id\") REFERENCES \"calendar_events\"(\"id\") ON DELETE CASCADE\n);\n\nCREATE INDEX \"calendar_events_user_start_idx\"\n  ON \"calendar_events\" (\"user_id\", \"start_at\");\n\nCREATE INDEX \"calendar_events_calendar_idx\"\n  ON \"calendar_events\" (\"calendar_id\");\n\nCREATE UNIQUE INDEX \"calendar_events_parent_original_start_idx\"\n  ON \"calendar_events\" (\"parent_event_id\", \"original_start_at\")\n  WHERE \"parent_event_id\" IS NOT NULL;\n\n-- Platser: fysiska omraden dar uppgifter kan slutfors.\n-- En plats har en koordinat och en radie i meter. Radien anvands for att\n-- avgora om en GPS-position ligger inom platsen.\nCREATE TABLE \"places\" (\n  \"id\" BIGINT NOT NULL GENERATED BY DEFAULT AS IDENTITY,\n  \"user_id\" INTEGER NOT NULL,\n  \"name\" VARCHAR(64) NOT NULL,\n  \"latitude\" DOUBLE PRECISION NOT NULL,\n  \"longitude\" DOUBLE PRECISION NOT NULL,\n  \"radius_meters\" INTEGER NOT NULL DEFAULT 100,\n  \"icon\" VARCHAR(100),\n  \"created_at\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  \"updated_at\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY (\"id\"),\n  FOREIGN KEY (\"user_id\") REFERENCES \"users\"(\"id\") ON DELETE CASCADE\n);\n\nCREATE INDEX \"places_user_idx\"\n  ON \"places\" (\"user_id\");\n\n-- Ett mal kan ha flera platser. Semantiken ar OR - malet ar gorbart om\n-- anvandaren befinner sig pa nagon av sina platser.\nCREATE TABLE \"goal_places\" (\n  \"goal_id\" BIGINT NOT NULL,\n  \"place_id\" BIGINT NOT NULL,\n  PRIMARY KEY (\"goal_id\", \"place_id\"),\n  FOREIGN KEY (\"goal_id\") REFERENCES \"goals\"(\"id\") ON DELETE CASCADE,\n  FOREIGN KEY (\"place_id\") REFERENCES \"places\"(\"id\") ON DELETE CASCADE\n);\n\nCREATE INDEX \"goal_places_place_idx\"\n  ON \"goal_places\" (\"place_id\");\n\n-- Kalenderhandelser kan ha platser, med samma modell som mal.\nCREATE TABLE \"calendar_event_places\" (\n  \"event_id\" BIGINT NOT NULL,\n  \"place_id\" BIGINT NOT NULL,\n  PRIMARY KEY (\"event_id\", \"place_id\"),\n  FOREIGN KEY (\"event_id\") REFERENCES \"calendar_events\"(\"id\") ON DELETE CASCADE,\n  FOREIGN KEY (\"place_id\") REFERENCES \"places\"(\"id\") ON DELETE CASCADE\n);\n\nCREATE INDEX \"calendar_event_places_place_idx\"\n  ON \"calendar_event_places\" (\"place_id\");\n\n-- Slutforda foreskomster for aterkommande mal. En rad per slutford\n-- foreskomst, med vilken foreskomst det var och nar den slutfordes.\nCREATE TABLE \"goal_completions\" (\n  \"id\" BIGINT NOT NULL GENERATED BY DEFAULT AS IDENTITY,\n  \"goal_id\" INTEGER NOT NULL,\n  \"occurrence_date\" DATE NOT NULL,\n  \"completed_at\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY (\"id\"),\n  CONSTRAINT goal_completions_unique_occurrence UNIQUE (\"goal_id\", \"occurrence_date\"),\n  FOREIGN KEY (\"goal_id\") REFERENCES \"goals\" (\"id\") ON DELETE CASCADE\n);\n\nCREATE INDEX \"goal_completions_goal_idx\"\n  ON \"goal_completions\" (\"goal_id\");\n\n-- Anvandarens \"jag ar har\"-plats. Null = ingen vald plats.\nALTER TABLE \"users\"\nADD COLUMN \"current_place_id\" BIGINT REFERENCES \"places\"(\"id\") ON DELETE SET NULL;\n\n-- API Keys for programmatic access (agents, integrations)\nCREATE TABLE IF NOT EXISTS \"api_keys\" (\n  \"id\" INTEGER NOT NULL UNIQUE GENERATED BY DEFAULT AS IDENTITY,\n  \"name\" VARCHAR(100) NOT NULL,\n  \"key_hash\" VARCHAR(255) NOT NULL UNIQUE,\n  \"user_id\" INTEGER,\n  \"scope\" VARCHAR(16) NOT NULL DEFAULT 'full',\n  \"created\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  \"last_used\" TIMESTAMPTZ,\n  \"expires\" TIMESTAMPTZ,\n  PRIMARY KEY(\"id\"),\n  CONSTRAINT api_keys_valid_scope CHECK (\"scope\" IN ('full', 'agent', 'readonly')),\n  FOREIGN KEY(\"user_id\") REFERENCES \"users\"(\"id\") ON DELETE SET NULL\n);\n-- Taggar: etiketter som kan sättas på mål (\"ute\", \"hem\", \"vinter\").\n-- En tagg hör till en användare - namnen normaliseras (gemener) i API:t,\n-- så \"Ute\" och \"ute\" blir samma tagg.\nCREATE TABLE \"tags\" (\n  \"id\" BIGINT NOT NULL GENERATED BY DEFAULT AS IDENTITY,\n  \"user_id\" INTEGER NOT NULL,\n  \"name\" VARCHAR(32) NOT NULL,\n  \"created_at\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY (\"id\"),\n  FOREIGN KEY (\"user_id\") REFERENCES \"users\"(\"id\") ON DELETE CASCADE\n);\n\nCREATE UNIQUE INDEX \"tags_user_name_idx\"\n  ON \"tags\" (\"user_id\", \"name\");\n\n-- Ett mål kan ha flera taggar, och en tagg kan sitta på flera mål.\nCREATE TABLE \"goal_tags\" (\n  \"goal_id\" INTEGER NOT NULL,\n  \"tag_id\" BIGINT NOT NULL,\n  PRIMARY KEY (\"goal_id\", \"tag_id\"),\n  FOREIGN KEY (\"goal_id\") REFERENCES \"goals\"(\"id\") ON DELETE CASCADE,\n  FOREIGN KEY (\"tag_id\") REFERENCES \"tags\"(\"id\") ON DELETE CASCADE\n);\n\nCREATE INDEX \"goal_tags_tag_idx\"\n  ON \"goal_tags\" (\"tag_id\");\n\n-- Agentkörningar: kopplingen mellan ett mål och det arbete en agent gör\n-- med det. Plan äger tabellen, så gränssnittet visar agentens arbete även\n-- när agent-tjänsten är nere.\nCREATE TABLE \"agent_runs\" (\n  \"id\" INTEGER NOT NULL UNIQUE GENERATED BY DEFAULT AS IDENTITY,\n  \"goal_id\" INTEGER NOT NULL,\n  \"phase\" VARCHAR(16) NOT NULL DEFAULT 'define',\n  \"status\" VARCHAR(16) NOT NULL DEFAULT 'queued',\n  \"trigger\" VARCHAR(16) NOT NULL DEFAULT 'user',\n  \"initiator\" TEXT NOT NULL DEFAULT '',\n  \"agent_profile\" VARCHAR(16) NOT NULL DEFAULT 'coding',\n  \"summary\" TEXT,\n  \"result\" TEXT NOT NULL DEFAULT '',\n  \"started_at\" TIMESTAMPTZ,\n  \"finished_at\" TIMESTAMPTZ,\n  \"artifact_url\" TEXT,\n  \"cost_usd\" DOUBLE PRECISION,\n  \"conversation_id\" TEXT,\n  -- Vilken agent och modell som gjorde körningen. Modellen behövs för\n  -- att räkna fram kostnaden ur prislistan.\n  \"agent_id\" VARCHAR(128) NOT NULL DEFAULT '',\n  \"provider\" VARCHAR(64) NOT NULL DEFAULT '',\n  \"model\" VARCHAR(64) NOT NULL DEFAULT '',\n  \"model_version\" VARCHAR(64) NOT NULL DEFAULT '',\n  -- Reserverad kostnad för körningar som pågår. Den räknas med i\n  -- budgetkontrollen så att samtidiga körningar inte överskrider gränsen.\n  \"reserved_cost_usd\" DOUBLE PRECISION NOT NULL DEFAULT 0,\n  \"created_at\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  \"updated_at\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY(\"id\"),\n  CONSTRAINT agent_runs_valid_phase CHECK (\"phase\" IN ('define', 'plan', 'execute', 'verify', 'completed')),\n  CONSTRAINT agent_runs_valid_status CHECK (\"status\" IN ('queued', 'running', 'waiting_approval', 'succeeded', 'failed', 'cancelled')),\n  CONSTRAINT agent_runs_valid_trigger CHECK (\"trigger\" IN ('user', 'schedule', 'webhook', 'agent')),\n  CONSTRAINT agent_runs_valid_profile CHECK (\"agent_profile\" IN ('coding', 'life')),\n  FOREIGN KEY (\"goal_id\") REFERENCES \"goals\"(\"id\") ON DELETE CASCADE\n);\n\nCREATE INDEX \"agent_runs_goal_idx\"\n  ON \"agent_runs\" (\"goal_id\");\n\n-- Händelser ger Plan en kronologisk och strukturerad historik för varje körning.\nCREATE TABLE IF NOT EXISTS \"agent_run_events\" (\n  \"id\" BIGINT NOT NULL GENERATED BY DEFAULT AS IDENTITY,\n  \"agent_run_id\" INTEGER NOT NULL,\n  \"type\" VARCHAR(64) NOT NULL,\n  \"phase\" VARCHAR(16) NOT NULL DEFAULT '',\n  \"payload\" JSONB NOT NULL DEFAULT '{}'::jsonb,\n  \"created_at\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY (\"id\"),\n  FOREIGN KEY (\"agent_run_id\") REFERENCES \"agent_runs\"(\"id\") ON DELETE CASCADE\n);\n\n-- Godkännanden: mänskliga beslut i agentkörningar. Plan äger dem, så\n-- beslutet finns kvar även när agenttjänsten är nere.\nCREATE TABLE IF NOT EXISTS \"agent_approvals\" (\n  \"id\" BIGINT NOT NULL GENERATED BY DEFAULT AS IDENTITY,\n  \"agent_run_id\" INTEGER NOT NULL,\n  \"goal_id\" INTEGER NOT NULL,\n  \"title\" VARCHAR(255) NOT NULL,\n  \"description\" TEXT NOT NULL DEFAULT '',\n  \"status\" VARCHAR(16) NOT NULL DEFAULT 'pending',\n  \"decided_by\" INTEGER,\n  \"feedback\" TEXT NOT NULL DEFAULT '',\n  \"consequence\" TEXT NOT NULL DEFAULT '',\n  \"verification_plan\" TEXT NOT NULL DEFAULT '',\n  \"payload\" JSONB NOT NULL DEFAULT '{}'::jsonb,\n  \"created_at\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  \"decided_at\" TIMESTAMPTZ,\n  PRIMARY KEY (\"id\"),\n  CONSTRAINT agent_approvals_valid_status CHECK (\"status\" IN ('pending', 'approved', 'rejected')),\n  FOREIGN KEY (\"agent_run_id\") REFERENCES \"agent_runs\" (\"id\") ON DELETE CASCADE,\n  FOREIGN KEY (\"goal_id\") REFERENCES \"goals\" (\"id\") ON DELETE CASCADE,\n  FOREIGN KEY (\"decided_by\") REFERENCES \"users\" (\"id\") ON DELETE SET NULL\n);\n\nCREATE INDEX IF NOT EXISTS \"agent_approvals_run_idx\"\n  ON \"agent_approvals\" (\"agent_run_id\", \"created_at\", \"id\");\n\nCREATE INDEX IF NOT EXISTS \"agent_approvals_pending_idx\"\n  ON \"agent_approvals\" (\"status\") WHERE \"status\" = 'pending';\n\nCREATE INDEX IF NOT EXISTS \"agent_run_events_run_idx\"\n  ON \"agent_run_events\" (\"agent_run_id\", \"created_at\", \"id\");\n-- Användning och kostnad per agentkörning. Plan räknar fram kostnaden ur\n-- en versionsstyrd prislista, så att kostnaden kan reproduceras.\nCREATE TABLE IF NOT EXISTS \"agent_run_usage\" (\n  \"id\" BIGINT NOT NULL GENERATED BY DEFAULT AS IDENTITY,\n  \"agent_run_id\" INTEGER NOT NULL,\n  \"goal_id\" INTEGER NOT NULL,\n  \"agent_id\" VARCHAR(128) NOT NULL DEFAULT '',\n  \"provider\" VARCHAR(64) NOT NULL DEFAULT '',\n  \"model\" VARCHAR(64) NOT NULL DEFAULT '',\n  \"model_version\" VARCHAR(64) NOT NULL DEFAULT '',\n  \"input_tokens\" INTEGER NOT NULL DEFAULT 0,\n  \"output_tokens\" INTEGER NOT NULL DEFAULT 0,\n  \"cache_read_tokens\" INTEGER NOT NULL DEFAULT 0,\n  \"tool_calls\" INTEGER NOT NULL DEFAULT 0,\n  \"tool_names\" TEXT[] NOT NULL DEFAULT '{}',\n  \"cost_usd\" DOUBLE PRECISION NOT NULL DEFAULT 0,\n  \"currency\" VARCHAR(8) NOT NULL DEFAULT 'USD',\n  \"price_list_version\" VARCHAR(32) NOT NULL DEFAULT '',\n  \"price_source\" VARCHAR(16) NOT NULL DEFAULT 'price_list',\n  \"status\" VARCHAR(16) NOT NULL DEFAULT 'reported',\n  \"started_at\" TIMESTAMPTZ,\n  \"finished_at\" TIMESTAMPTZ,\n  \"created_at\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY (\"id\"),\n  CONSTRAINT agent_run_usage_valid_status CHECK (\"status\" IN ('reported', 'incomplete')),\n  FOREIGN KEY (\"agent_run_id\") REFERENCES \"agent_runs\" (\"id\") ON DELETE CASCADE,\n  FOREIGN KEY (\"goal_id\") REFERENCES \"goals\" (\"id\") ON DELETE CASCADE\n);\n\nCREATE UNIQUE INDEX IF NOT EXISTS \"agent_run_usage_run_idx\"\n  ON \"agent_run_usage\" (\"agent_run_id\");\n\nCREATE INDEX IF NOT EXISTS \"agent_run_usage_goal_idx\"\n  ON \"agent_run_usage\" (\"goal_id\");\n\nCREATE INDEX IF NOT EXISTS \"agent_run_usage_agent_idx\"\n  ON \"agent_run_usage\" (\"agent_id\");\n\n-- Budgetgränser för agentkostnad. En budget gäller en period och gäller\n-- antingen en enskild agent eller alla agenter.\nCREATE TABLE IF NOT EXISTS \"agent_budgets\" (\n  \"id\" BIGINT NOT NULL GENERATED BY DEFAULT AS IDENTITY,\n  \"user_id\" INTEGER NOT NULL,\n  \"name\" VARCHAR(64) NOT NULL,\n  \"period\" VARCHAR(16) NOT NULL DEFAULT 'month',\n  \"hard_limit_usd\" DOUBLE PRECISION NOT NULL DEFAULT 0,\n  \"warning_limit_usd\" DOUBLE PRECISION,\n  \"reservation_per_run_usd\" DOUBLE PRECISION NOT NULL DEFAULT 1,\n  \"agent_id\" VARCHAR(128) NOT NULL DEFAULT '',\n  \"active\" BOOLEAN NOT NULL DEFAULT TRUE,\n  \"created_at\" TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,\n  PRIMARY KEY (\"id\"),\n  CONSTRAINT agent_budgets_valid_period CHECK (\"period\" IN ('day', 'week', 'month')),\n  FOREIGN KEY (\"user_id\") REFERENCES \"users\" (\"id\") ON DELETE CASCADE\n);\n\nCREATE INDEX IF NOT EXISTS \"agent_budgets_user_idx\"\n  ON \"agent_budgets\" (\"user_id\", \"active\");\n\n"
