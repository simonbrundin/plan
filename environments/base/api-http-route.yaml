apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: go-api-route
  labels:
    app: go-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: simons-gateway
      namespace: envoy
  hostnames:
    - "plan.simonbrundin.com"
  rules:
    # Hälsokontrollen på API:t - den rapporterar vilken build som
    # kör, så att en rökprov efter rollout kan se att den nya
    # versionen svarar. /api/health tillhör Nuxt (appens egen
    # kontroll), så de två krockar inte.
    - matches:
        - path:
            type: Exact
            value: /health
      backendRefs:
        - kind: Service
          name: go-api-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - kind: Service
          name: go-api-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /docs
      backendRefs:
        - kind: Service
          name: go-api-service
          port: 8080
