# =============================================================================
# Kubernetes Jobs för AgentRuns
#
# Två ServiceAccounts med olika ansvar:
#
#   plan-agent-worker  - används av jobb-poderna. Har inga rättigheter alls,
#                         jobbet ska bara kunna arbeta i sin egen pod.
#   plan-agent-api     - används av agent-API:t för att skapa och läsa Jobb.
#                         Får bara Jobb-rättigheter i namespace, inget annat.
#
# Hemligheter (Plan-nyckel och modellnyckel) läses från Secrets - de skrivs
# aldrig i manifesten.
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: plan-agent-worker
  namespace: plan
  labels:
    app: agent-worker
# Jobbet ska inte kunna prata med Kubernetes-API:t.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plan-agent-api
  namespace: plan
  labels:
    app: agent-api
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plan-agent-job-controller
  namespace: plan
  labels:
    app: agent-api
rules:
  # Jobb får skapas, läsas och rensas bort - inget annat.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Loggar läses för att visa vad som hände i en körning.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plan-agent-job-controller
  namespace: plan
  labels:
    app: agent-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: plan-agent-job-controller
subjects:
  - kind: ServiceAccount
    name: plan-agent-api
    namespace: plan
