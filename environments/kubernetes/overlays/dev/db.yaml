# Dev PostgreSQL - simple deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: plan
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plan
      tier: database
  template:
    metadata:
      labels:
        app: plan
        tier: database
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: plan
            - name: POSTGRES_USER
              value: plan
            - name: POSTGRES_PASSWORD
              value: plan
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: plan
spec:
  type: ClusterIP
  selector:
    app: plan
    tier: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
