# Preview-miljön kör API:t i Rust - samma kod som prod.
#
# Databasen är en egen CNPG-kluster i preview-ns (inte prodens), och
# schemat appliceras av Atlas Operator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: plan-api
    preview: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plan-api
  template:
    metadata:
      labels:
        app: plan-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: api
          image: API_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plan-pr-db-user
                  key: uri
            - name: NUXT_SESSION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plan-pr-session
                  key: NUXT_SESSION_PASSWORD
            # Preview kör utan Zitadel: dev-login skapar en lokal session.
            - name: DEV_AUTH_ENABLED
              value: "true"
            - name: AUTH_DISABLED
              value: "false"
            - name: APP_DOMAIN
              value: "HOSTNAME_PLACEHOLDER"
            - name: FRONTEND_URL
              value: "https://HOSTNAME_PLACEHOLDER"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
