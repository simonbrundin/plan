# Agentens databas i dev. Lösenordet är i klartext - det är bara dev.
# I prod ligger motsvarande hemlighet SOPS-krypterad.
apiVersion: v1
kind: Secret
metadata:
  name: plan-agent-db-app
  namespace: plan
type: kubernetes.io/basic-auth
stringData:
  username: agent
  password: dev-agent-db-password
  uri: postgres://agent:dev-agent-db-password@plan-agent-db-rw.plan.svc.cluster.local:5432/agent?sslmode=disable
