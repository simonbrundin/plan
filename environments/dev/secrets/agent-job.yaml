# Hemlighet för jobbens Plan-nyckel.
#
# Värdet är agent-nyckeln från AGENT_API_KEY - den ger user 1 i den lokala
# dev-miljön, men med agent-scope: jobbet får arbeta med mål och körningar,
# men aldrig besluta om ett godkännande. Riktiga miljöer hämtar nyckeln från
# en egen hemlighet.
apiVersion: v1
kind: Secret
metadata:
  name: plan-agent-api-key
  namespace: plan
  labels:
    app: agent-worker
type: Opaque
stringData:
  PLAN_API_KEY: dev-agent-key
  # Nyckeln Plan använder mot agent-API:t.
  AGENT_API_KEY: dev-agent-service-key
