apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            # Lokal inloggning utan Zitadel (POST /api/v1/auth/dev-login).
            - name: DEV_AUTH_ENABLED
              value: "true"
            # Endast för lokal dev: en nyckel som ger fullt access.
            - name: API_KEY_BYPASS
              value: "dev-bypass-key"
            # Agentens nyckel mot Plan. Nyckeln har agent-scope: den får
            # arbeta med mål och körningar men aldrig besluta om ett
            # godkännande eller radera något.
            - name: AGENT_API_KEY
              value: "dev-agent-key"
            # Dev kör mot Neon (ingen Postgres i klustret).
            # Base sätter DATABASE_URL från CNPG-secreten - här pekas den
            # om till den poolade Neon-endpointen.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plan-db-neon
                  key: DATABASE_URL
            - name: NUXT_SESSION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: NUXT_SESSION_PASSWORD
            # Adresser för dev: frontend via port-forward, API via port-forward.
            - name: APP_DOMAIN
              value: "localhost:4100"
            - name: FRONTEND_URL
              value: "http://localhost:3100"
            # Webbbläsaren anropar API:t direkt, och i dev ligger appen på
            # :3100 medan API:t ligger på :4100 - olika origin, så API:t måste
            # svara med CORS-headrar för appens origin.
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:3100"
            # Måste vara identisk med redirect_uri i authorize- och
            # token-bytet (Zitadel avvisar annars bytet).
            - name: ZITADEL_REDIRECT_URI
              value: "http://localhost:4100/api/v1/auth/callback"
