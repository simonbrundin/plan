# DO NOT EDIT MANUALLY
# Dev environment

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: plan

resources:
  - ../base
  - db
  - pgadmin
  - secrets/auth.yaml
  # Agentens hemligheter i dev. I prod är de SOPS-krypterade.
  - secrets/agent-db.yaml
  - secrets/agent-job.yaml

patches:
  - path: patches/nuxt-deployment.yaml
  - path: patches/api-deployment.yaml
  # Dev har ingen Postgres i klustret - databasen är Neon.
  # Ta bort CNPG-klustret som ligger i base/db.
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: plan-db
    patch: |-
      $patch: delete
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: plan-db
  # Atlas operatören ska applicera schemat mot Neon, inte mot CNPG.
  - target:
      group: db.atlasgo.io
      version: v1alpha1
      kind: AtlasSchema
      name: plan-db-schema
    patch: |-
      - op: replace
        path: /spec/urlFrom/secretKeyRef/name
        value: plan-db-neon
      - op: replace
        path: /spec/urlFrom/secretKeyRef/key
        value: uri

# Images byggda av Tilt
images:
  - name: ghcr.io/simonbrundin/plan
    newName: plan-nuxt
    newTag: latest
  - name: ghcr.io/simonbrundin/plan:frontend-202606121357
    newName: plan-nuxt
    newTag: latest
  - name: plan-go-api
    newName: plan-go-api
  # Agent-imagen byggs av Tilt och finns i den lokala registret.
  - name: ghcr.io/simonbrundin/plan-agent
    newName: plan-agent
    newTag: latest
