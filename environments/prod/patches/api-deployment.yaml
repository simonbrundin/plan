apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
spec:
  template:
    spec:
      containers:
        - name: api
          # Rust-imagen byggs av .github/workflows/commit.rust-images.yaml.
          image: ghcr.io/simonbrundin/rust-api:sha-1fdc501
          env:
            - name: AUTH_DISABLED
              value: "false"
            # Webbläsaren anropar API:t direkt. I prod ligger appen och API:t
            # på samma host, så CORS egentligen inte behövs - men listan gör
            # beteendet explicit och samma env används om appen flyttas.
            - name: CORS_ALLOWED_ORIGINS
              value: "https://plan.simonbrundin.com"
            - name: NUXT_SESSION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: NUXT_SESSION_PASSWORD
            # Keep SESSION_SECRET for backwards compatibility during rollout
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: NUXT_SESSION_PASSWORD
