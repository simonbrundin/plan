apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
spec:
  template:
    spec:
      containers:
        - name: api
          # Rust-imagen byggs av .github/workflows/commit.rust-images.yaml.
          image: ghcr.io/simonbrundin/rust-api:sha-e92f3de
          env:
            - name: AUTH_DISABLED
              value: "false"
            - name: NUXT_SESSION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: NUXT_SESSION_PASSWORD
            # Keep SESSION_SECRET for backwards compatibility during rollout
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: NUXT_SESSION_PASSWORD
            # Nyckeln agenten använder mot Plan. API:t känner den under
            # namnet AGENT_API_KEY - det är namnet middleware:t letar
            # efter. Värdet är agentens egen PLAN_API_KEY, så att agenten
            # och API:t pratar med samma nyckel.
            #
            # Nyckeln har agent-scope: den får arbeta med mål och
            # körningar, men aldrig besluta om ett godkännande eller
            # radera något. Gränsen lever i API:t, inte i en prompt.
            - name: AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: plan-agent-api-key
                  key: PLAN_API_KEY
