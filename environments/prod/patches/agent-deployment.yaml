# Agenten är inte i drift i prod ännu.
#
# Manifesten ligger i basen så att dev och prod delar samma källa, men
# agenten tas bort här tills hemligheterna finns:
#
#   plan-agent-db-app    - agentens databas (SOPS)
#   plan-agent-api-key   - Plan-nyckeln och agentens egen nyckel (SOPS)
#   plan-agent-llm       - modellnyckeln (SOPS)
#   plan-agent-git       - git-hemligheten för att publicera branchar (SOPS)
#
# När de finns tas den här patchen bort och agenten börjar köra samma
# kod som dev.
$patch: delete
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
  namespace: plan
