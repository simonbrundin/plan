# Agent-API:t i produktion kör Rust-imagen.
#
# Go-agentens image ligger i base/ - dev kör fortfarande Go, så bytet
# ligger här i stället. Base-imagen ändras bara när Go-modulen raderas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
  # Basen sätter namespace på agent-API:t, så patchen måste matcha
  # samma namespace - annars hittar kustomize inget att patcha.
  namespace: plan
spec:
  template:
    spec:
      containers:
        - name: agent-api
          image: ghcr.io/simonbrundin/rust-agent:sha-b96d83d
