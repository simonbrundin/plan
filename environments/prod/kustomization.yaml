apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Basen innehåller även databasen (base/db) - prod har ingen egen kopia av
  # schemat, annars får man två ConfigMap:ar med namnet plan-db-schema.
  - ../base
  - secrets

patches:
  - path: patches/api-deployment.yaml
  - path: patches/deployment.yaml
  - path: patches/http-route.yaml
  - path: patches/db-instances-patch.yaml
