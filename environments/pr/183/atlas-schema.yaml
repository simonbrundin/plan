# start.
apiVersion: db.atlasgo.io/v1alpha1
kind: AtlasSchema
metadata:
  name: plan-db-schema
  labels:
    preview: "true"
spec:
  urlFrom:
    secretKeyRef:
      key: uri
      name: plan-pr-db-user
  schema:
    configMapKeyRef:
      key: schema.sql
      name: plan-db-schema
  schemas:
    - "public"
