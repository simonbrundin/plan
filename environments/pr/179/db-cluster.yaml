# Egen Postgres per PR. Den ligger i preview-ns:et, så en PR kan inte
# röra prod-data - och prod kan inte röra PR:ens data.
#
# Rollen "plan" får samma lösenord som i Secretet, därför pekar
# managed.roles på samma Secret som API:t och Atlas använder.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: plan-db
  labels:
    preview: "true"
spec:
  instances: 1
  bootstrap:
    initdb:
      database: plan
      owner: plan
      postInitSQL:
        - "GRANT ALL ON SCHEMA public TO plan"
        - "ALTER DEFAULT PRIVILEGES FOR ROLE plan IN SCHEMA public GRANT ALL ON TABLES TO plan"
        - "ALTER DEFAULT PRIVILEGES FOR ROLE plan IN SCHEMA public GRANT ALL ON SEQUENCES TO plan"
  storage:
    storageClass: cnpg
    size: 1Gi
  managed:
    roles:
      - name: plan
        ensure: present
        login: true
        passwordSecret:
          name: plan-pr-db-user
