# Hemligheter för agenten i previewen.
#
# Nycklarna är preview-egna och obetydliga - de ger bara åtkomst till
# previewens egna API och agent. De kopplas ihop så här:
#
#   PLAN_API_KEY   = agentens nyckel mot API:t (det API:t svarar på med
#                    AGENT_API_KEY, alltså agent-scope)
#   AGENT_API_KEY  = nyckeln Plan (Nuxt) använder mot agent-API:t
#
# Båda sätts i respektive deployment. API:t får AGENT_API_KEY, agenten
# får PLAN_API_KEY, och Nuxt får AGENT_API_KEY.
apiVersion: v1
kind: Secret
metadata:
  name: plan-agent-api-key
type: Opaque
stringData:
  PLAN_API_KEY: preview-agent-key
  AGENT_API_KEY: preview-agent-service-key
