# DO NOT EDIT MANUALLY
# Genereras av .github/scripts/pr-preview-resources.py
# PR 186 - https://plan-pr-186.simonbrundin.com

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nuxt-app
  labels:
    app: plan-app
    preview: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plan-app
  template:
    metadata:
      labels:
        app: plan-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: plan-app
          image: ghcr.io/simonbrundin/plan/pr-preview:186-bac26d9ea0aafb2b1101dfff7cec5f60e0242c55
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NUXT_PUBLIC_APP_URL
              value: "https://plan-pr-186.simonbrundin.com"
            - name: NUXT_PUBLIC_GO_API_URL
              value: "https://plan-pr-186.simonbrundin.com/api/v1"
            # Server-side URL till API:t inuti klustret. Namnet bygger på
            # preview-ns:et - därför står det i deploymenten, inte i en
            # gemensam bas.
            - name: NUXT_GO_API_INTERNAL_URL
              value: "http://plan-pr-api-service.plan-pr-186.svc.cluster.local:8080/api/v1"
            - name: NUXT_SESSION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: plan-pr-session
                  key: NUXT_SESSION_PASSWORD
            # Agent-API:t i samma preview - chatt och godkännanden.
            - name: NUXT_AGENT_API_INTERNAL_URL
              value: "http://plan-pr-agent-service.plan-pr-186.svc.cluster.local:8080/api/v1"
            # Nyckeln skickas server-side, aldrig till webbläsaren.
            - name: NUXT_AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: plan-agent-api-key
                  key: AGENT_API_KEY
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
