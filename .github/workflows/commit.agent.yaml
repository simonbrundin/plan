name: CI för agenten
on:
  push:
    paths:
      - src/agent/**
      - src/commands/**
      - .github/workflows/commit.agent.yaml
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/agent/go.mod
          cache-dependency-path: src/agent/go.sum

      - name: Vet
        working-directory: src/agent
        run: go vet ./...

      - name: Test
        working-directory: src/agent
        run: go test ./...

  build-publish-image:
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/simonbrundin/plan-agent
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/agent/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get short sha
        id: sha
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short-sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Update agent image
        env:
          IMAGE: >-
            ghcr.io/simonbrundin/plan-agent:sha-${{ steps.sha.outputs.short-sha }}
        run: |
          echo "Updating image to: $IMAGE"
          sed -i "s|image: ghcr.io/simonbrundin/plan-agent.*|image: $IMAGE|" \
            environments/base/agent-deployment.yaml

      - name: Create PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update plan-agent image"
          branch: bot/update-plan-agent-image
          delete-branch: true
          title: "chore: update plan-agent image"
          body: |
            Automated image update from the agent workflow
            - Image: `ghcr.io/simonbrundin/plan-agent:sha-${{ steps.sha.outputs.short-sha }}`
          labels: |
            ci
            skip-review
          add-paths: |
            environments/base/agent-deployment.yaml
