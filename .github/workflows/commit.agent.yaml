name: CI för Go-agenten (gammal kod - testas men deployas inte)
# Go-agenten är fasad ut i favour av Rust
# (src/rust/crates/plan-agent). Koden ligger kvar så länge migreringen
# pågår, och testerna körs fortfarande - de fångar regressioner i den
# Go-kod som Rust-porten jämförs mot.
#
# Workflowen bygger INGEN image och rör INGA manifest. Production kör
# rust-agent, och bilden publiceras av commit.rust-images.yaml. Den här
# workflowen ska tas bort när Go-modulen raderas.
#
# Tillsammans med paritetstestet i src/rust/crates/plan-parity utgör
# den här workflowen migreringens grind: Go-koden testas, och Rust
# kontrolleras mot Go:s route-registreringar.
on:
  push:
    paths:
      - src/agent/**
      # Kommandona ligger i src/agent/commands och täcks av src/agent/** ovan.
      # Byggcontexten för agent-imagen styrs av .dockerignore i repo-roten.
      # Ändras den ska bilden byggas om.
      - .dockerignore
      - .github/workflows/commit.agent.yaml
      # Go-modulen ligger i src/ och omfattar både api/ och agent/ - en
      # ändring i API-koden eller i kontraktet kan påverka agentens build.
      - src/go.mod
      - src/go.sum
      - src/contracts/**
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Vet
        working-directory: src
        run: go vet ./agent/...

      - name: Test
        working-directory: src
        run: go test ./agent/...
