name: CI för Rust-tjänsterna
# Rust är huvudspåret: API:t och agenten i src/rust är de som körs i
# dev och i produktion.
#
# Den här workflowen är grinden - format, lint och tester. Själva
# imagebygget ligger i commit.rust-images.yaml, som också är den enda
# workflow som skriver in images i prod-manifesten. (Go-flödena, se
# commit.api.yaml och commit.agent.yaml, bygger och deployar inte
# längre - de testas bara så länge Go-koden finns kvar.)
#
# Viktigt: prod-klustret kör arm64, så images måste byggas för båda
# arkitekturerna. Det gör commit.rust-images.yaml - på egna runners per
# arkitektur, inte under QEMU.
on:
  push:
    paths:
      - src/rust/**
      - src/api/cmd/api/main.go # route-pariteten jämförs mot den
      - src/agent/internal/api/server.go # agentens route-paritet
      - src/contracts/plan-agent.yaml # kontraktet mellan Plan och agenten
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-rust-${{ hashFiles('src/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Paritetstesterna jämför Rust-tabellerna mot route-registreringarna
      # i Go-källan, och kontraktet mellan Plan och agenten testas från
      # båda sidor. En endpoint som glöms bort i migreringen failar här.
      - name: Test
        run: cargo test
