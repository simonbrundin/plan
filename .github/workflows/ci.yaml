name: CI för Plan-applikation
on: [push]

permissions:
  contents: read
  packages: write

jobs:
  unit-tests:
    uses: >-
      simonbrundin/deployment-pipeline/.github/workflows/run-tests-bun.yaml@main
    with:
      package-json-path: src/nuxt

  # Enhetstesterna i src/nuxt/test/unit körs med bun:s egen testrunner.
  # De är skrivna med "bun:test" och kördes inte alls tidigare - bara
  # cucumber-testerna i feature-flödet kördes i CI.
  nuxt-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/nuxt
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            src/nuxt/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('src/nuxt/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:unit

  # Typecheck-gate: antalet typfel per fil får inte öka. Gränssnittet har
  # ärvd teknisk skuld - gateen fångar regressioner i stället för att
  # kräva att allt är rent.
  nuxt-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/nuxt
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            src/nuxt/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('src/nuxt/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate types
        # vue-tsc läser .nuxt/tsconfig.*.json - de skapas av nuxt prepare.
        run: bun run postinstall

      - name: Typecheck
        run: bun run typecheck
