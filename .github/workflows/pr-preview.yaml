name: PR Preview Deployment
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ============================================
  # JOB 1: Skapa/Uppdatera PR Preview
  # ============================================
  create-preview:
    name: Skapa PR Preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.publish.outputs.image }}
      pr-number: ${{ steps.pr-info.outputs.pr_number }}
    steps:
      - name: Hämta PR-info
        id: pr-info
        run: |
          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "pr_branch=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Logga in i GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bygg och publicera image
        id: publish
        uses: docker/build-push-action@v5
        with:
          context: src/nuxt
          file: src/nuxt/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/plan/pr-preview:${{ github.event.pull_request.number }}-${{ github.sha }}
            ${{ env.REGISTRY }}/plan/pr-preview:${{ github.event.pull_request.number }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Sätt upp Python för Git operationer
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Skapa PR Preview resurser
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.image }}
        run: |
          python3 .github/scripts/pr-preview-resources.py

      - name: Commit och pusha ändringar
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Konfigurera git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Lägg till alla ändringar
          git add environments/pr/
          
          # Kontrollera om det finns något att committa
          if git diff --staged --quiet; then
            echo "Inga ändringar att committa"
            exit 0
          fi
          
          # Committa
          git commit -F - <<'MSG'
          chore: add preview resources for PR $PR_NUM

          Auto-generated by GitHub Actions PR Preview workflow.
          Flux will reconcile these manifests to create a preview deployment.

          Image: ${{ steps.publish.outputs.image }}
          MSG
          
          # Pusha
          git push origin ${{ github.event.pull_request.head.ref }}
          
          echo "✓ Pushade preview manifests"

      - name: Lägg till PR-kommentar med preview-info
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          IMAGE: ${{ steps.publish.outputs.image }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment $PR_NUM --body-file - <<'COMMENT'
          ## 🚀 PR Preview Deployment

          En preview-miljö håller på att deployas för denna PR.

          ### Resurser
          | Resurs | Värde |
          |--------|-------|
          | **Namespace** | `plan-pr-$PR_NUM` |
          | **URL** | https://plan-pr-$PR_NUM.simonbrundin.com |
          | **Image** | `$IMAGE` |

          ### GitOps Flöde
          ```
          GitHub Actions
              │
              ├── Build image → GHCR
              │
              └── Commit → environments/pr/$PR_NUM/
                            └── environments/pr/kustomization.yaml
                                   │
                                   ▼
                             Flux
                               │
                               ▼
                        preview-plan-pr-$PR_NUM
          ```

          > [!NOTE]
          > Det kan ta 1-2 minuter innan Flux har reconcilat alla resurser.
          COMMENT

  # ============================================
  # JOB 2: Städa bort preview vid PR-stängning
  # ============================================
  cleanup-preview:
    name: Städa upp PR Preview
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Hämta PR-nummer
        id: pr-info
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            environments/pr

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ta bort preview-resurser och uppdatera kustomization
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/pr-preview-cleanup.py

      - name: Commit och pusha
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Konfigurera git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Lägg till ändringar
          git add environments/pr/
          
          if git diff --staged --quiet; then
            echo "Inga ändringar att committa"
            exit 0
          fi
          
          # Committa
          git commit -F - <<'MSG'
          chore: remove preview resources for PR $PR_NUM

          Auto-generated cleanup by GitHub Actions.
          Flux will clean up Kubernetes resources.
          MSG
          
          # Pusha direkt till main
          git push origin main
          
          echo "✓ Tog bort preview-resurser"

      - name: Kommentera PR
        if: always()
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment $PR_NUM --body-file - <<'COMMENT'
          ## 🧹 PR Preview Stängd

          Preview-miljön `plan-pr-$PR_NUM` håller på att städas bort.

          Flux tar bort alla Kubernetes-resurser.
          COMMENT
