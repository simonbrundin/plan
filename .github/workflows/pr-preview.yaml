name: PR Preview Deployment
# Varje PR får en egen, kastbar miljö i klustret:
#
#   namespace plan-pr-<nr>, egen hostname, egen databas.
#
# Overlayen publiceras på branchen "previews", som Flux applicerar
# (Kustomization "plan-preview" i infrastructure-flux). Branchen används
# för att Flux ska kunna följa en PR - GitRepository "plan" läser bara
# main.
#
# Båda imagerna byggs för amd64 och arm64. Klustret kör arm64, så en
# amd64-only-image ger "no match for platform in manifest" vid pull.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    # En docs-ändring bygger ingen ny preview - den skulle bara kosta
    # byggminuter. Ändras själva flödet körs det om, så att en ny
    # byggmetod verifieras.
    paths-ignore:
      - "docs/**"
      - "wiki/**"
      - "**/*.md"
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  # Samma tagg för alla arkitekturer - Kubernetes väljer rätt variant.
  IMAGE_TAG: ${{ github.event.pull_request.number }}-${{ github.sha }}

jobs:
  # ============================================
  # JOB 1: Bygg imagerna (en runner per arkitektur)
  # ============================================
  # Varje arkitektur byggs på en runner av samma arkitektur. Arm64
  # under QEMU tar timmar för en Rust-kompilering, så arm64 byggs i
  # stället på en riktig arm64-runner.
  bygg:
    name: Bygg ${{ matrix.image }} för ${{ matrix.platform }}
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-review')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nuxt
            repo: plan/pr-preview
            runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            context: src/nuxt
            file: src/nuxt/Dockerfile
          - image: nuxt
            repo: plan/pr-preview
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            context: src/nuxt
            file: src/nuxt/Dockerfile
          - image: api
            repo: rust-api/pr-preview
            runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            context: src
            file: src/rust/Dockerfile
          - image: api
            repo: rust-api/pr-preview
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            context: src
            file: src/rust/Dockerfile
          # Agenten byggs ur repo-roten - samma kontext som i prod.
          - image: agent
            repo: rust-agent/pr-preview
            runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            context: .
            file: src/rust/Dockerfile.agent
          - image: agent
            repo: rust-agent/pr-preview
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            context: .
            file: src/rust/Dockerfile.agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logga in i GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bygg och pusha ${{ matrix.platform }}
        id: bygg
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          outputs: type=image,push-by-digest=true,name-canonical=true
          tags: ${{ env.REGISTRY }}/${{ matrix.repo }}
          # PR:ens head-sha - smoke-testen jämför den mot det som
          # /api/health rapporterar.
          build-args: BUILD_SHA=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Spara digest
        run: |
          mkdir -p digests
          echo "${{ steps.bygg.outputs.digest }}" > "digests/${{ matrix.image }}-${{ matrix.arch }}"

      - name: Ladda upp digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/
          retention-days: 1

  # ============================================
  # JOB 2: Slå ihop manifesten och publicera previewen
  # ============================================
  create-preview:
    name: Skapa PR Preview
    needs: bygg
    # Samma villkor som byggjobbet - annars kör det här steget utan
    # images (byggjobbet hoppades över) och rött i bot-PR:ens checks.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logga in i GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ladda ner digester
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests/

      - name: Slå ihop manifesten
        run: |
          set -euo pipefail

          NUXT_AMD64="$(cat digests/nuxt-amd64)"
          NUXT_ARM64="$(cat digests/nuxt-arm64)"
          API_AMD64="$(cat digests/api-amd64)"
          API_ARM64="$(cat digests/api-arm64)"
          AGENT_AMD64="$(cat digests/agent-amd64)"
          AGENT_ARM64="$(cat digests/agent-arm64)"

          docker buildx imagetools create \
            -t "${REGISTRY}/plan/pr-preview:${IMAGE_TAG}" \
            "${REGISTRY}/plan/pr-preview@${NUXT_AMD64}" \
            "${REGISTRY}/plan/pr-preview@${NUXT_ARM64}"

          docker buildx imagetools create \
            -t "${REGISTRY}/rust-api/pr-preview:${IMAGE_TAG}" \
            "${REGISTRY}/rust-api/pr-preview@${API_AMD64}" \
            "${REGISTRY}/rust-api/pr-preview@${API_ARM64}"

          docker buildx imagetools create \
            -t "${REGISTRY}/rust-agent/pr-preview:${IMAGE_TAG}" \
            "${REGISTRY}/rust-agent/pr-preview@${AGENT_AMD64}" \
            "${REGISTRY}/rust-agent/pr-preview@${AGENT_ARM64}"

      - name: Sätt upp Python för Git operationer
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installera Python-beroenden
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Skapa PR Preview resurser
        env:
          NUXT_IMAGE: ${{ env.REGISTRY }}/plan/pr-preview:${{ env.IMAGE_TAG }}
          API_IMAGE: ${{ env.REGISTRY }}/rust-api/pr-preview:${{ env.IMAGE_TAG }}
          AGENT_IMAGE: ${{ env.REGISTRY }}/rust-agent/pr-preview:${{ env.IMAGE_TAG }}
          # Agenten jobbar mot PR:ens egen kod. Är PR:en från en fork
          # används forken - annars huvudrepoet.
          PR_HEAD_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 .github/scripts/pr-preview-resources.py

      - name: Publicera overlayen på previews-branchen
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Overlayen ligger i arbetskopian. Spara den utanför repot -
          # nästa steg byter branch, och den genererade katalogen ska
          # inte följa med i checkouten.
          rm -rf /tmp/preview-overlay
          mkdir -p /tmp/preview-overlay
          cp -r "environments/pr/${PR_NUMBER}/." /tmp/preview-overlay/

          # Ta bort den genererade katalogen ur arbetskopian. Annars
          # vägrar git byta branch - den genererade katalogen är
          # oversionerad, och branchen innehåller en katalog med samma
          # namn.
          rm -rf "environments/pr/${PR_NUMBER}"

          for attempt in 1 2 3 4 5; do
            if git fetch origin previews; then
              git checkout -B previews origin/previews
            else
              # Branchen finns inte än. Den innehåller bara preview-
              # overlays - ingen kod, ingen historik.
              git checkout --orphan previews
              git rm -rf . > /dev/null 2>&1 || true
            fi

            mkdir -p "environments/pr/${PR_NUMBER}"
            cp -r /tmp/preview-overlay/. "environments/pr/${PR_NUMBER}/"
            git add "environments/pr/${PR_NUMBER}"

            if git diff --cached --quiet; then
              echo "Ingen ändring - previewen är redan publicerad"
              exit 0
            fi

            git commit -m "preview: PR ${PR_NUMBER}"
            if git push origin previews; then
              echo "✓ Pushade previewen till previews-branchen"
              exit 0
            fi

            echo "Pushen kolliderade med en annan PR - försöker igen"
          done

          echo "Kunde inte publicera previewen" >&2
          exit 1

      # Rökprov efter att overlayen publicerats. Flux applicerar
      # previewen, och det tar en tid - skriptet väntar in sig på den
      # nya build-versionen innan det testar API, dev-login och
      # databasberoende anrop.
      - name: Rökprov mot previewen
        env:
          PREVIEW_URL: https://plan-pr-${{ env.PR_NUMBER }}.simonbrundin.com
          EXPECT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          .github/scripts/smoke-test.sh \
            --url "$PREVIEW_URL" \
            --mode preview \
            --expect "$EXPECT_SHA" \
            --wait 420 | tee /tmp/smoke-result.txt

      - name: Lägg till PR-kommentar med preview-info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## 🚀 PR Preview Deployment"
            echo ""
            echo "### Resurser"
            echo "| Resurs | Värde |"
            echo "|--------|-------|"
            echo "| **Namespace** | \`plan-pr-$PR_NUMBER\` |"
            echo "| **URL** | https://plan-pr-$PR_NUMBER.simonbrundin.com |"
            echo "| **Nuxt-image** | \`$REGISTRY/plan/pr-preview:$IMAGE_TAG\` |"
            echo "| **API-image (Rust)** | \`$REGISTRY/rust-api/pr-preview:$IMAGE_TAG\` |"
            echo "| **Agent-image (Rust)** | \`$REGISTRY/rust-agent/pr-preview:$IMAGE_TAG\` |"
            echo ""
            echo "### Rökprov"
            echo ""
            echo '```'
            cat /tmp/smoke-result.txt 2>/dev/null || echo "Rökprovet kördes inte."
            echo '```'
            echo ""
            echo "> [!NOTE]"
            echo "> Logga in med dev-login - previewen kör utan Zitadel."
          } > /tmp/pr-comment.md

          gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md

  # ============================================
  # JOB 3: Städa bort preview vid PR-stängning
  # ============================================
  cleanup-preview:
    name: Städa upp PR Preview
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Hämta PR-nummer
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installera Python-beroenden
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Ta bort previewen från previews-branchen
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Spara skriptet utanför repot. Branchen "previews" innehåller
          # bara overlays - skriptet finns inte kvar i arbetskopian när
          # branchen byts.
          cp .github/scripts/pr-preview-cleanup.py /tmp/pr-preview-cleanup.py

          if ! git fetch origin previews; then
            echo "Branchen 'previews' finns inte - inget att städa"
            exit 0
          fi

          git checkout -B previews origin/previews
          python3 /tmp/pr-preview-cleanup.py

          # Stagea FÖRE kontrollen. Annars jämförs indexet med HEAD,
          # medan borttagningen bara finns i arbetskopian - och git
          # säger "ingen ändring" fast overlayen är borta.
          git add -A environments/pr

          if git diff --cached --quiet; then
            echo "Ingen ändring att committa"
          else
            git commit -m "chore: ta bort preview för PR ${PR_NUMBER}"
            git push origin previews
            echo "✓ Städade bort previewen"
          fi

      - name: Kommentera PR
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file - <<'COMMENT'
          ## 🧹 PR Preview Stängd

          Preview-miljön `plan-pr-$PR_NUMBER` håller på att städas bort.

          Flux tar bort alla Kubernetes-resurser, inklusive previewens databas.
          COMMENT
