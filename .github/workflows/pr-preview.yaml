name: PR Preview Deployment
# Varje PR får en egen, kastbar miljö i klustret:
#
#   namespace plan-pr-<nr>, egen hostname, egen databas.
#
# Overlayen publiceras på branchen "previews", som Flux applicerar
# (Kustomization "plan-preview" i infrastructure-flux). Branchen används
# för att Flux ska kunna följa en PR - GitRepository "plan" läser bara
# main.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ============================================
  # JOB 1: Skapa/uppdatera PR Preview
  # ============================================
  create-preview:
    name: Skapa PR Preview
    # Bot-PR (label skip-review) får ingen preview-miljö. Annars skapar
    # städjobbet en ny PR för varje PR, och kedjan blir oändlig.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-review')
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.pr-info.outputs.pr_number }}
    steps:
      - name: Hämta PR-info
        id: pr-info
        run: |
          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "pr_branch=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Logga in i GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gränssnittet byggs först - det är den del PR:en oftast ändrar.
      - name: Bygg och publicera Nuxt-imagen
        id: publish-nuxt
        uses: docker/build-push-action@v5
        with:
          context: src/nuxt
          file: src/nuxt/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/plan/pr-preview:${{ github.event.pull_request.number }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      # API:t byggs ur Rust - samma Dockerfile som prod kör.
      - name: Bygg och publicera API-imagen (Rust)
        id: publish-api
        uses: docker/build-push-action@v5
        with:
          context: src
          file: src/rust/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/rust-api/pr-preview:${{ github.event.pull_request.number }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Sätt upp Python för Git operationer
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installera Python-beroenden
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Skapa PR Preview resurser
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          NUXT_IMAGE: ${{ env.REGISTRY }}/plan/pr-preview:${{ github.event.pull_request.number }}-${{ github.sha }}
          API_IMAGE: ${{ env.REGISTRY }}/rust-api/pr-preview:${{ github.event.pull_request.number }}-${{ github.sha }}
        run: |
          python3 .github/scripts/pr-preview-resources.py

      - name: Publicera overlayen på previews-branchen
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Overlayen ligger i arbetskopian. Spara den utanför repot -
          # nästa steg byter branch, och den genererade katalogen ska
          # inte följa med i checkouten.
          rm -rf /tmp/preview-overlay
          mkdir -p /tmp/preview-overlay
          cp -r "environments/pr/${PR_NUM}/." /tmp/preview-overlay/

          for attempt in 1 2 3 4 5; do
            if git fetch origin previews; then
              git checkout -B previews origin/previews
            else
              # Branchen finns inte än. Den innehåller bara preview-
              # overlays - ingen kod, ingen historik.
              git checkout --orphan previews
              git rm -rf . > /dev/null 2>&1 || true
            fi

            mkdir -p "environments/pr/${PR_NUM}"
            cp -r /tmp/preview-overlay/. "environments/pr/${PR_NUM}/"
            git add "environments/pr/${PR_NUM}"

            if git diff --cached --quiet; then
              echo "Ingen ändring - previewen är redan publicerad"
              exit 0
            fi

            git commit -m "preview: PR ${PR_NUM}"
            if git push origin previews; then
              echo "✓ Pushade previewen till previews-branchen"
              exit 0
            fi

            echo "Pushen kolliderade med en annan PR - försöker igen"
          done

          echo "Kunde inte publicera previewen" >&2
          exit 1

      - name: Lägg till PR-kommentar med preview-info
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          NUXT_IMAGE: ${{ env.REGISTRY }}/plan/pr-preview:${{ github.event.pull_request.number }}-${{ github.sha }}
          API_IMAGE: ${{ env.REGISTRY }}/rust-api/pr-preview:${{ github.event.pull_request.number }}-${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment $PR_NUM --body-file - <<'COMMENT'
          ## 🚀 PR Preview Deployment

          En preview-miljö håller på att deployas för denna PR.

          ### Resurser
          | Resurs | Värde |
          |--------|-------|
          | **Namespace** | `plan-pr-$PR_NUM` |
          | **URL** | https://plan-pr-$PR_NUM.simonbrundin.com |
          | **Nuxt-image** | `$NUXT_IMAGE` |
          | **API-image (Rust)** | `$API_IMAGE` |

          ### GitOps-flöde
          ```
          GitHub Actions
              │
              ├── Bygger Nuxt + Rust-API → GHCR
              │
              └── Commit → previews-branchen
                            └── environments/pr/$PR_NUM/
                                   │
                                   ▼
                             Flux (Kustomization "plan-preview")
                                   │
                                   ▼
                        plan-pr-$PR_NUM (egen databas, dev-login)
          ```

          > [!NOTE]
          > Det kan ta 1-2 minuter innan Flux har reconcilat alla resurser.
          > Logga in med dev-login - previewen kör utan Zitadel.
          COMMENT

  # ============================================
  # JOB 2: Städa bort preview vid PR-stängning
  # ============================================
  cleanup-preview:
    name: Städa upp PR Preview
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Hämta PR-nummer
        id: pr-info
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installera Python-beroenden
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Ta bort previewen från previews-branchen
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          if ! git fetch origin previews; then
            echo "Branchen 'previews' finns inte - inget att städa"
            exit 0
          fi

          git checkout -B previews origin/previews
          python3 .github/scripts/pr-preview-cleanup.py

          if git diff --cached --quiet; then
            echo "Ingen ändring att committa"
          else
            git add -A environments/pr
            git commit -m "chore: ta bort preview för PR ${PR_NUM}"
            git push origin previews
            echo "✓ Städade bort previewen"
          fi

      - name: Kommentera PR
        if: always()
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment $PR_NUM --body-file - <<'COMMENT'
          ## 🧹 PR Preview Stängd

          Preview-miljön `plan-pr-$PR_NUM` håller på att städas bort.

          Flux tar bort alla Kubernetes-resurser, inklusive previewens databas.
          COMMENT
