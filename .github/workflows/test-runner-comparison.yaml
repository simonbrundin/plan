name: Test Runner Comparison
on:
  workflow_dispatch:

jobs:
  # Test med GitHub-hosted runner
  github-hosted:
    runs-on: ubuntu-latest
    steps:
      - name: Start timer
        run: echo "START=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          cd src/nuxt
          bun install --frozen-lockfile || bun install

      - name: Run tests
        run: |
          cd src/nuxt
          bun test || echo "No tests found"

      - name: End timer
        run: |
          END=$(date +%s)
          DURATION=$(( END - START ))
          echo "END=$END" >> $GITHUB_ENV
          echo "DURATION=$DURATION" >> $GITHUB_ENV
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

  # Test med self-hosted runner
  self-hosted:
    runs-on: self-hosted-runners
    steps:
      - name: Start timer
        run: echo "START=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          cd src/nuxt
          bun install --frozen-lockfile || bun install

      - name: Run tests
        run: |
          cd src/nuxt
          bun test || echo "No tests found"

      - name: End timer
        run: |
          END=$(date +%s)
          DURATION=$(( END - START ))
          echo "END=$END" >> $GITHUB_ENV
          echo "DURATION=$DURATION" >> $GITHUB_ENV
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

  compare:
    needs: [github-hosted, self-hosted]
    runs-on: ubuntu-latest
    steps:
      - name: Compare results
        run: |
          echo "=== RUNNER COMPARISON ==="
          echo "GitHub-hosted: ${{ needs.github-hosted.outputs.duration }} seconds"
          echo "Self-hosted: ${{ needs.self-hosted.outputs.duration }} seconds"
          
          GH=${{ needs.github-hosted.outputs.duration }}
          SH=${{ needs.self-hosted.outputs.duration }}
          
          if [ "$SH" -lt "$GH" ]; then
            echo "🏆 Self-hosted wins by $(( GH - SH )) seconds!"
          else
            echo "🏆 GitHub-hosted wins by $(( SH - GH )) seconds!"
          fi
