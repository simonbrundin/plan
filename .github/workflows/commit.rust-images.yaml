name: Bygg Rust-imagerna
# Bygger och publicerar Plan-API:t och agenten i Rust som containerimager.
# Deploymenten byts inte automatiskt - det är ett medvetet beslut, se
# docs/ och specs/rust-migration.md.
on:
  push:
    paths:
      - src/rust/**
      - src/.dockerignore
      - .dockerignore
  workflow_dispatch:

jobs:
  build-publish-image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API:t
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/simonbrundin/rust-api
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Byggkontexten är src/ - samma som Go-tjänstens image.
      #
      # Bara amd64 byggs här. Klustret kör amd64, och dev-miljön bygger
      # sina images lokalt med Tilt - arm64 under QEMU-emulering tar
      # timmar för en Rust-kompilering.
      - name: Build and push API:t
        uses: docker/build-push-action@v5
        with:
          context: src
          file: src/rust/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for agenten
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/simonbrundin/rust-agent
          tags: |
            type=sha,format=short
            type=raw,value=latest

      # Byggkontexten är repo-roten - samma som Go-agentens image. Imageen
      # innehåller både agent-api och agent-worker, och kommandofilerna
      # som agenten läser.
      - name: Build and push agenten
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/rust/Dockerfile.agent
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Taggen på bilderna skrivs in i de manifest som prod deployar.
      # Pr-set granskas innan det slås ihop - bytet till Rust ska vara
      # ett medvetet beslut, inte en sidoeffekt av ett bygg.
      - name: Get short sha
        id: sha
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short-sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Uppdatera bilderna i produktion
        env:
          API_IMAGE: ghcr.io/simonbrundin/rust-api:sha-${{ steps.sha.outputs.short-sha }}
          AGENT_IMAGE: ghcr.io/simonbrundin/rust-agent:sha-${{ steps.sha.outputs.short-sha }}
        run: |
          sed -i "s|image: ghcr.io/simonbrundin/rust-api.*|image: $API_IMAGE|" \
            environments/prod/patches/api-deployment.yaml
          sed -i "s|image: ghcr.io/simonbrundin/rust-agent.*|image: $AGENT_IMAGE|" \
            environments/prod/patches/agent-deployment.yaml

      - name: Create PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: uppdatera Rust-imagerna"
          branch: bot/update-rust-images
          delete-branch: true
          title: "chore: uppdatera Rust-imagerna"
          body: |
            Uppdaterar API:t och agenten till den senaste Rust-imagen.
            - API: `ghcr.io/simonbrundin/rust-api:sha-${{ steps.sha.outputs.short-sha }}`
            - Agent: `ghcr.io/simonbrundin/rust-agent:sha-${{ steps.sha.outputs.short-sha }}`
          labels: |
            ci
            skip-review
          add-paths: |
            environments/prod/patches/api-deployment.yaml
            environments/prod/patches/agent-deployment.yaml
