name: Go CI för agenten

on:
  push:
    branches: [main]
    paths:
      - 'src/agent/**'
      - '.github/workflows/agent-go.yml'
      # Go-modulen ligger i src/ och omfattar både api/ och agent/.
      - 'src/go.mod'
      - 'src/go.sum'
      - 'src/api/**'
      - 'src/contracts/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/agent/**'
      - '.github/workflows/agent-go.yml'
      - 'src/go.mod'
      - 'src/go.sum'
      - 'src/api/**'
      - 'src/contracts/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: src/go.sum

      - name: Download dependencies
        run: |
          cd src
          go mod download

      - name: Run go vet
        run: |
          cd src
          go vet ./agent/...

      - name: Run tests
        run: |
          cd src
          # features_test körs också (feature-filen ligger i .features/).
          go test -v -race -coverprofile=coverage.out ./agent/...

      - name: Build
        run: |
          cd src
          go build -o /tmp/agent-worker ./agent/cmd/agentworker

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agent-coverage
          path: src/coverage.out

      - name: Coverage report
        if: success()
        run: |
          cd src
          go tool cover -func=coverage.out | tail -5

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: src/go.sum

      - name: Run golangci-lint
        # v2 av golangci-lint byggs med en Go-version som klarar go.mod:s
        # Go-version. v1 av actionen installerar en äldre linter som
        # vägrar köra mot ett modernt Go-mål.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: src
          args: ./agent/...
