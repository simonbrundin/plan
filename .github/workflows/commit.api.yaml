name: CI för Go API
on:
  push:
    paths:
      - src/api/**

jobs:
  build-publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/simonbrundin/plan-api
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: src/api
          file: src/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get short sha
        id: sha
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short-sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Update deployment image
        env:
          IMAGE: ghcr.io/simonbrundin/plan-api:sha-${{ steps.sha.outputs.short-sha }}
        run: |
          echo "Updating image to: $IMAGE"
          sed -i "s|image: ghcr.io/simonbrundin/plan-api.*|image: $IMAGE|" \
            environments/common/api-deployment.yaml

      - name: Create PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update plan-api image"
          branch: bot/update-plan-api-image
          delete-branch: true
          title: "chore: update plan-api image"
          body: |
            Automated image update from Go API workflow
            - Image: `ghcr.io/simonbrundin/plan-api:${{ github.sha }}`
          labels: |
            ci
            skip-review
          add-paths: |
            environments/common/api-deployment.yaml
