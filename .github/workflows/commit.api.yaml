name: CI för Go API
on:
  push:
    paths:
      - src/api/**
      # Go-modulen ligger i src/ och omfattar både api/ och agent/.
      - src/go.mod
      - src/go.sum
      - src/contracts/**
      - src/.dockerignore
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Vet
        working-directory: src
        run: go vet ./api/...

      - name: Test
        working-directory: src
        run: go test ./api/...

  # Lint-gate för Plan-API:t - samma linter som agenten använder.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Run golangci-lint
        # v2 av golangci-lint byggs med en Go-version som klarar go.mod:s
        # Go-version. v1 av actionen installerar en äldre linter som
        # vägrar köra mot ett modernt Go-mål.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: src
          args: ./api/...

  build-publish-image:
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/simonbrundin/go-api
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: src
          file: src/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get short sha
        id: sha
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short-sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Update deployment image
        env:
          IMAGE: >-
            ghcr.io/simonbrundin/go-api:sha-${{ steps.sha.outputs.short-sha }}
        run: |
          echo "Updating image to: $IMAGE"
          sed -i "s|image: ghcr.io/simonbrundin/go-api.*|image: $IMAGE|" \
            environments/prod/patches/api-deployment.yaml

      - name: Create PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update plan-api image"
          branch: bot/update-plan-api-image
          delete-branch: true
          title: "chore: update plan-api image"
          body: |
            Automated image update from Go API workflow
            - Image: `ghcr.io/simonbrundin/go-api:sha-${{ steps.sha.outputs.short-sha }}`
          labels: |
            ci
            skip-review
          add-paths: |
            environments/prod/patches/api-deployment.yaml
