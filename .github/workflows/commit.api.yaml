name: CI för Go API:t (gammal kod - testas men deployas inte)
# Go-tjänsten är fasad ut i favour av Rust (src/rust/crates/plan-api).
# Koden ligger kvar så länge migreringen pågår, och testerna körs
# fortfarande - de fångar regressioner i den Go-kod som Rust-porten
# jämförs mot.
#
# Workflowen bygger INGEN image och rör INGA manifest. Production kör
# rust-api, och bilden publiceras av commit.rust-images.yaml. Den här
# workflowen ska tas bort när Go-modulen raderas.
#
# Tillsammans med paritetstestet i src/rust/crates/plan-parity utgör
# den här workflowen migreringens grind: Go-koden testas, och Rust
# kontrolleras mot Go:s route-registreringar.
on:
  push:
    paths:
      - src/api/**
      # Go-modulen ligger i src/ och omfattar både api/ och agent/.
      - src/go.mod
      - src/go.sum
      - src/contracts/**
      - src/.dockerignore
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Vet
        working-directory: src
        run: go vet ./api/...

      - name: Test
        working-directory: src
        run: go test ./api/...

  # Lint-gate för Plan-API:t - samma linter som agenten använder.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Run golangci-lint
        # v2 av golangci-lint byggs med en Go-version som klarar go.mod:s
        # Go-version. v1 av actionen installerar en äldre linter som
        # vägrar köra mot ett modernt Go-mål.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: src
          args: ./api/...
